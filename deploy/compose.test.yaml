services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pitch_test
      POSTGRES_USER: pitch
      POSTGRES_PASSWORD: booking
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitch -d pitch_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
