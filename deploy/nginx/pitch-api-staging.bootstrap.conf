server {
    listen 80;
    listen [::]:80;
    server_name pitch-api-staging.modelstella.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        default_type application/json;
        add_header Retry-After 3600 always;
        return 503 '{"status":"not_deployed","message":"Pitch booking staging API is not deployed yet."}\n';
    }
}
