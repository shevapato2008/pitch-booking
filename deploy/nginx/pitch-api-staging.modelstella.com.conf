server {
    listen 80;
    listen [::]:80;
    server_name pitch-api-staging.modelstella.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pitch-api-staging.modelstella.com;

    ssl_certificate /etc/letsencrypt/live/pitch-api-staging.modelstella.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pitch-api-staging.modelstella.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    default_type application/json;
    add_header Retry-After 3600 always;
    return 503 '{"status":"not_deployed","message":"Pitch booking staging API is not deployed yet."}\n';
}
