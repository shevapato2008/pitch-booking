    OpenGameApplyBlockedReason:
      type: string
      enum: [AUTH_REQUIRED, OWNER_CANNOT_APPLY, ALREADY_APPLIED, GAME_NOT_PUBLISHED, REGISTRATION_DEADLINE_PASSED, GAME_SUSPENDED, GAME_CANCELLED, GAME_COMPLETED, GAME_STARTED]
    OpenGameReviewBlockedReason:
      type: string
      enum: [APPLICATION_NOT_PENDING, GAME_SUSPENDED, GAME_CANCELLED, GAME_COMPLETED, GAME_STARTED, GAME_FULL]
    OpenGameWaitlistBlockedReason:
      type: string
      enum: [APPLICATION_NOT_PENDING, GAME_SUSPENDED, GAME_CANCELLED, GAME_COMPLETED, GAME_STARTED, GAME_NOT_FULL, WAITLIST_NOT_ENABLED]
    OpenGameApplyActions:
      type: object
      additionalProperties: false
      required: [can_apply, apply_blocked_reason]
      properties:
        can_apply: {type: boolean}
        apply_blocked_reason:
          oneOf:
            - $ref: '#/components/schemas/OpenGameApplyBlockedReason'
            - type: 'null'
      oneOf:
        - properties:
            can_apply: {const: true}
            apply_blocked_reason: {const: null}
        - properties:
            can_apply: {const: false}
            apply_blocked_reason: {$ref: '#/components/schemas/OpenGameApplyBlockedReason'}
    OpenGameReviewActions:
      type: object
      additionalProperties: false
      required: [can_accept, accept_blocked_reason, can_waitlist, waitlist_blocked_reason, can_reject, reject_blocked_reason]
      properties:
        can_accept: {type: boolean}
        accept_blocked_reason:
          oneOf:
            - $ref: '#/components/schemas/OpenGameReviewBlockedReason'
            - type: 'null'
        can_waitlist: {type: boolean}
        waitlist_blocked_reason:
          oneOf:
            - $ref: '#/components/schemas/OpenGameWaitlistBlockedReason'
            - type: 'null'
        can_reject: {type: boolean}
        reject_blocked_reason:
          oneOf:
            - $ref: '#/components/schemas/OpenGameReviewBlockedReason'
            - type: 'null'
      allOf:
        - oneOf:
            - properties:
                can_accept: {const: true}
                accept_blocked_reason: {const: null}
            - properties:
                can_accept: {const: false}
                accept_blocked_reason: {$ref: '#/components/schemas/OpenGameReviewBlockedReason'}
        - oneOf:
            - properties:
                can_waitlist: {const: true}
                waitlist_blocked_reason: {const: null}
            - properties:
                can_waitlist: {const: false}
                waitlist_blocked_reason: {$ref: '#/components/schemas/OpenGameWaitlistBlockedReason'}
        - oneOf:
            - properties:
                can_reject: {const: true}
                reject_blocked_reason: {const: null}
            - properties:
                can_reject: {const: false}
                reject_blocked_reason:
                  type: string
                  enum: [APPLICATION_NOT_PENDING, GAME_SUSPENDED, GAME_CANCELLED, GAME_COMPLETED, GAME_STARTED]
        - not:
            properties:
              can_accept: {const: true}
              can_waitlist: {const: true}
      oneOf:
        - properties:
            can_accept: {const: true}
            accept_blocked_reason: {const: null}
            can_waitlist: {const: false}
            waitlist_blocked_reason: {const: GAME_NOT_FULL}
            can_reject: {const: true}
            reject_blocked_reason: {const: null}
        - properties:
            can_accept: {const: false}
            accept_blocked_reason: {const: GAME_FULL}
            can_waitlist: {const: false}
            waitlist_blocked_reason: {const: WAITLIST_NOT_ENABLED}
            can_reject: {const: true}
            reject_blocked_reason: {const: null}
        - properties:
            can_accept: {const: false}
            accept_blocked_reason: {const: GAME_FULL}
            can_waitlist: {const: true}
            waitlist_blocked_reason: {const: null}
            can_reject: {const: true}
            reject_blocked_reason: {const: null}
        - properties:
            can_accept: {const: false}
            accept_blocked_reason: {const: APPLICATION_NOT_PENDING}
            can_waitlist: {const: false}
            waitlist_blocked_reason: {const: APPLICATION_NOT_PENDING}
            can_reject: {const: false}
            reject_blocked_reason: {const: APPLICATION_NOT_PENDING}
        - properties:
            can_accept: {const: false}
            accept_blocked_reason: {const: GAME_SUSPENDED}
            can_waitlist: {const: false}
            waitlist_blocked_reason: {const: GAME_SUSPENDED}
            can_reject: {const: false}
            reject_blocked_reason: {const: GAME_SUSPENDED}
        - properties:
            can_accept: {const: false}
            accept_blocked_reason: {const: GAME_CANCELLED}
            can_waitlist: {const: false}
            waitlist_blocked_reason: {const: GAME_CANCELLED}
            can_reject: {const: false}
            reject_blocked_reason: {const: GAME_CANCELLED}
        - properties:
            can_accept: {const: false}
            accept_blocked_reason: {const: GAME_COMPLETED}
            can_waitlist: {const: false}
            waitlist_blocked_reason: {const: GAME_COMPLETED}
            can_reject: {const: false}
            reject_blocked_reason: {const: GAME_COMPLETED}
        - properties:
            can_accept: {const: false}
            accept_blocked_reason: {const: GAME_STARTED}
            can_waitlist: {const: false}
            waitlist_blocked_reason: {const: GAME_STARTED}
            can_reject: {const: false}
            reject_blocked_reason: {const: GAME_STARTED}
