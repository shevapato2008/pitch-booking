          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200': {$ref: '#/components/responses/ManualVenueProfileReviewQueue'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ManualModerationForbidden'}
  /api/v1/admin/moderation/venue-profiles/{item_id}/decisions:
    post:
      operationId: decidePendingVenueProfileModeration
      description: Applies PASS or one fixed rejection reason only if this remains the current item version.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModerationItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualModerationDecision'}
      responses:
        '204': {$ref: '#/components/responses/ManualModerationDecisionApplied'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/ManualModerationForbidden'}
        '404': {$ref: '#/components/responses/VenueProfileNotFound'}
        '409': {$ref: '#/components/responses/VenueProfileVersionConflict'}
        '422': {$ref: '#/components/responses/VenueProfileValidationFailed'}
  /api/v1/admin/venues/{venue_id}/pitch-configuration:
    get:
      operationId: getAdminVenuePitchConfiguration
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Authoritative physical pitch configuration and capability snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PitchConfiguration'}
              examples:
                Ready:
                  externalValue: './examples/pitch-configuration-ready.json'
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Inventory permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Venue not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    put:
      operationId: saveAdminVenuePitchConfiguration
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavePitchConfiguration'}
      responses:
        '200':
          description: Atomic change set applied or replayed with the full authoritative result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PitchConfiguration'}
              examples:
                Saved:
                  externalValue: './examples/pitch-configuration-saved.json'
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403':
          description: Inventory permission required.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                InventoryForbidden: {externalValue: './examples/error-inventory-forbidden.json'}
        '404':
          description: Venue or pitch not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                PitchNotFound: {externalValue: './examples/error-pitch-not-found.json'}
        '409':
          description: Version, idempotency, name, history, or lifecycle conflict.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                ConfigurationChanged: {externalValue: './examples/error-configuration-changed.json'}
                PitchNameConflict: {externalValue: './examples/error-pitch-name-conflict.json'}
                PitchFormatImmutable: {externalValue: './examples/error-pitch-format-immutable.json'}
                PitchHasBusinessHistory: {externalValue: './examples/error-pitch-has-business-history.json'}
                PitchDeactivateBlocked: {externalValue: './examples/error-pitch-deactivate-blocked.json'}
                LastActivePitchRequired: {externalValue: './examples/error-last-active-pitch-required.json'}
                RequestInProgress: {externalValue: './examples/error-request-in-progress.json'}
        '422':
          description: Change set invalid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                InvalidPlayersPerSide: {externalValue: './examples/error-invalid-players-per-side.json'}
                InvalidCustomName: {externalValue: './examples/error-invalid-custom-name.json'}
                DuplicatePitchChange: {externalValue: './examples/error-duplicate-pitch-change.json'}
  /api/v1/admin/venues/{venue_id}/inventory:
    get:
      operationId: getAdminVenueInventory
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: local_date
          in: query
          required: true
          schema: {type: string, format: date}
        - name: pitch_id
          in: query
          required: false
          schema:
            type: [string, 'null']
            format: uuid
      responses:
        '200':
          description: Authorized venue, ordered pitches, and selected-pitch inventory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminInventory'}
              examples:
                Ready:
                  externalValue: './examples/admin-inventory-ready.json'
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Inventory permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Venue or pitch not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: Date or query invalid, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/admin/venues/{venue_id}/inventory/slots:
    post:
      operationId: createAdminInventorySlot
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAdminInventorySlot'}
      responses:
        '201':
          description: Available future slot created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminInventorySlot'}
              examples:
                Created:
                  externalValue: './examples/admin-inventory-slot.json'
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Inventory permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Venue or pitch not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409':
          description: Idempotency or time conflict.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                SlotTimeConflict: {externalValue: './examples/error-slot-time-conflict.json'}
        '422': {description: Slot input invalid, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/admin/venues/{venue_id}/inventory/slots/{slot_id}:
    put:
      operationId: updateAdminInventorySlot
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slot_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAdminInventorySlot'}
      responses:
        '200':
          description: Slot price and availability state updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminInventorySlot'}
              examples:
                Updated:
                  externalValue: './examples/admin-inventory-slot.json'
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Inventory permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404':
          description: Venue or slot not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                SlotNotFound: {externalValue: './examples/error-slot-not-found.json'}
        '409':
          description: Version conflict or immutable slot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                InventoryVersionConflict: {externalValue: './examples/error-inventory-version-conflict.json'}
                InventorySlotReadOnly: {externalValue: './examples/error-inventory-slot-read-only.json'}
        '422': {description: Slot update invalid, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /platform-admin/api/v1/auth/session:
    post:
      operationId: createPlatformSession
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformSessionExchange'}
      responses:
        '200':
          description: Platform staff session created.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformSession'}
              examples:
                PlatformSession: {externalValue: './examples/platform-session.json'}
        '401': {description: Staff access token is invalid, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_AUTH_INVALID}}}}}]}}}}
        '403': {description: Same-origin validation failed, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_CSRF_INVALID}}}}}]}}}}
        '422': {description: Login input is invalid, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: INVALID_ARGUMENT}}}}}]}}}}
        '503': {description: Platform authentication is unavailable, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}}]}}}}
    get:
      operationId: getPlatformSession
      security:
        - platformSession: []
      responses:
        '200':
          description: Current platform staff session.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformSession'}
              examples:
                PlatformSession: {externalValue: './examples/platform-session.json'}
        '401': {description: Active platform staff session required, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_AUTH_REQUIRED}}}}}]}}}}
        '503': {description: Platform authentication is unavailable, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}}]}}}}
    delete:
      operationId: deletePlatformSession
      security:
        - platformSession: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '204': {description: Platform staff session revoked.}
        '401': {description: Active platform staff session required, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_AUTH_REQUIRED}}}}}]}}}}
        '403': {description: Same-origin or CSRF validation failed, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_CSRF_INVALID}}}}}]}}}}
        '503': {description: Platform authentication is unavailable, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}}]}}}}
  /platform-admin/api/v1/onboarding/applications:
    get:
      operationId: listPlatformOnboardingApplications
      description: Newest-first platform review queue. Private evidence storage fields and phone ciphertext are never returned.
      security:
        - platformSession: []
      parameters:
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [CLAIM, CREATE]}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [SUBMITTED, APPROVED, REJECTED]}
        - name: cursor
          in: query
          required: false
          schema: {type: [string, 'null']}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Filtered review queue.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformOnboardingQueue'}
              examples:
                Queue: {externalValue: './examples/platform-onboarding-queue.json'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformReviewForbidden'}
        '422': {$ref: '#/components/responses/PlatformOnboardingInvalid'}
        '503': {$ref: '#/components/responses/PlatformOnboardingUnavailable'}
  /platform-admin/api/v1/onboarding/applications/{application_id}:
    get:
      operationId: getPlatformOnboardingApplication
      security:
        - platformSession: []
      parameters:
        - $ref: '#/components/parameters/OnboardingApplicationId'
      responses:
        '200':
          description: Reviewer detail with masked phone and closed evidence metadata.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformOnboardingApplicationDetail'}
              examples:
                Detail: {externalValue: './examples/platform-onboarding-detail.json'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformReviewForbidden'}
        '404': {$ref: '#/components/responses/PlatformOnboardingNotFound'}
        '422': {$ref: '#/components/responses/PlatformOnboardingInvalid'}
        '503': {$ref: '#/components/responses/PlatformOnboardingUnavailable'}
  /platform-admin/api/v1/onboarding/evidence/{evidence_id}/download:
    get:
      operationId: createPlatformOnboardingEvidenceDownload
      description: Issues a short-lived attachment-oriented GET URL for completed evidence attached to an onboarding application.
      security:
        - platformSession: []
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Short-lived private evidence download.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformOnboardingEvidenceDownload'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformReviewForbidden'}
        '404': {$ref: '#/components/responses/PlatformOnboardingNotFound'}
        '422': {$ref: '#/components/responses/PlatformOnboardingInvalid'}
        '503': {$ref: '#/components/responses/PlatformOnboardingUnavailable'}
  /platform-admin/api/v1/onboarding/applications/{application_id}/decisions:
    post:
      operationId: decidePlatformOnboardingApplication
      description: >-
        Atomically approves or rejects one application. An equivalent outcome and trimmed reason replays the existing
        decision; any different decision against a decided application returns a state conflict.
      security:
        - platformSession: []
      parameters:
        - $ref: '#/components/parameters/OnboardingApplicationId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformOnboardingDecisionRequest'}
      responses:
        '200':
          description: Decision applied or equivalently replayed.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformOnboardingDecision'}
              examples:
                Decision: {externalValue: './examples/platform-onboarding-decision.json'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformReviewForbidden'}
        '404': {$ref: '#/components/responses/PlatformOnboardingNotFound'}
        '409':
          description: Application already has a different immutable decision or a duplicate venue blocks approval.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: {enum: [ONBOARDING_APPLICATION_STATE_CHANGED, POSSIBLE_DUPLICATE_VENUE]}
        '422': {$ref: '#/components/responses/PlatformOnboardingInvalid'}
        '503': {$ref: '#/components/responses/PlatformOnboardingUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    platformSession:
      type: apiKey
      in: cookie
      name: pitch_platform_session
  headers:
    RequestId:
      description: Identifier used to trace the request.
      required: true
      schema:
        type: string
        minLength: 1
  parameters:
    VenueId:
      name: venue_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ImageId:
      name: image_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ModerationItemId:
      name: item_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse the same key to recover the authoritative result after an unknown outcome.
      schema: {type: string, minLength: 16, maxLength: 128}
    OnboardingApplicationId:
      name: application_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    PlatformAuthRequired:
      description: Active platform staff session required.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: PLATFORM_AUTH_REQUIRED}}}}
    PlatformReviewForbidden:
      description: Platform onboarding reviewer role or valid mutation protection required.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {enum: [PLATFORM_ROLE_REQUIRED, PLATFORM_CSRF_INVALID]}}}}
    PlatformOnboardingNotFound:
      description: Application or attached evidence not found.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: ONBOARDING_APPLICATION_NOT_FOUND}}}}
    PlatformOnboardingInvalid:
      description: Filter, cursor, path, or decision input is invalid.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: INVALID_ARGUMENT}}}}
    PlatformOnboardingUnavailable:
      description: Platform onboarding review service is unavailable.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}
    AuthRequired:
      description: Authentication required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    VenueProfileForbidden:
      description: Venue profile management permission required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ManualModerationForbidden:
      description: Configured platform moderation reviewer permission required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    VenueProfileNotFound:
      description: Venue, image, revision, or moderation item not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    VenueProfileSnapshot:
      description: Published authority and the current private draft with fixed catalogs.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminVenueProfile'}
          examples:
            Ready: {externalValue: './examples/venue-profile-admin-ready.json'}
            Reviewing: {externalValue: './examples/venue-profile-reviewing.json'}
            Rejected: {externalValue: './examples/venue-profile-rejected.json'}
    VenueProfileMutationApplied:
      description: Mutation applied or replayed with the authoritative profile snapshot.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminVenueProfile'}
          examples:
            Ready: {externalValue: './examples/venue-profile-admin-ready.json'}
    VenueProfileUploadIntentCreated:
      description: Private direct-upload reservation created; the URL is short-lived and contains no credentials.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VenueProfileUploadIntent'}
          examples:
            UploadIntent: {externalValue: './examples/venue-profile-upload-intent.json'}
    VenueProfileReviewStarted:
      description: Upload completion or moderation retry accepted with the current reviewing snapshot.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminVenueProfile'}
          examples:
            Reviewing: {externalValue: './examples/venue-profile-reviewing.json'}
    ManualVenueProfileReviewQueue:
      description: Current PENDING_MANUAL items visible only to configured reviewers.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManualReviewQueue'}
          examples:
            Pending: {externalValue: './examples/manual-review-queue.json'}
    ManualModerationDecisionApplied:
      description: Decision applied or idempotently replayed; no response body.
    VenueProfileVersionConflict:
      description: Facility, revision, item, or idempotency authority changed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            VenueProfileVersionConflict: {externalValue: './examples/error-venue-profile-version-conflict.json'}
    VenueProfileValidationFailed:
      description: Description, facility, image, MIME type, size, order, cover, or decision is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            VenueProfileValidationFailed: {externalValue: './examples/error-venue-profile-validation.json'}
  schemas:
    PlatformOnboardingVenueSummary:
      type: object
      additionalProperties: false
      required: [venue_id, name, address, district_name]
      properties:
        venue_id: {type: [string, 'null'], format: uuid}
        name: {type: string, minLength: 1}
        address: {type: string, minLength: 1}
        district_name: {type: string, minLength: 1}
    PlatformOnboardingQueueItem:
      type: object
      additionalProperties: false
      required: [application_id, kind, status, contact_name, venue, submitted_at, reviewed_at]
      properties:
        application_id: {type: string, format: uuid}
        kind: {type: string, enum: [CLAIM, CREATE]}
        status: {type: string, enum: [SUBMITTED, APPROVED, REJECTED]}
        contact_name: {type: string, minLength: 1, maxLength: 40}
        venue: {$ref: '#/components/schemas/PlatformOnboardingVenueSummary'}
        submitted_at: {type: string, format: date-time}
        reviewed_at: {type: [string, 'null'], format: date-time}
    PlatformOnboardingQueue:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlatformOnboardingQueueItem'}
        next_cursor: {type: [string, 'null']}
    PlatformOnboardingApplicant:
      type: object
      additionalProperties: false
      required: [contact_name, masked_phone]
      properties:
        contact_name: {type: string, minLength: 1, maxLength: 40}
