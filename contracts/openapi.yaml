        masked_phone:
          type: string
          pattern: '^1[0-9]{2}\*{4}[0-9]{4}$'
    OrderDetail:
      type: object
      additionalProperties: false
      oneOf:
        - type: object
          description: Pending order with no payment attempt.
          properties:
            status:
              const: PENDING_PAYMENT
            payment_state:
              const: null
            payment_confirming:
              const: false
            closing_payment:
              const: false
            paid_at:
              const: null
            expired_at:
              const: null
        - type: object
          description: Pending order with a launchable or creating payment attempt.
          properties:
            status:
              const: PENDING_PAYMENT
            payment_state:
              enum: [CREATING, PREPAY_CREATED]
            payment_confirming:
              const: false
            closing_payment:
              const: false
            paid_at:
              const: null
            expired_at:
              const: null
        - type: object
          description: Pending order waiting for payment authority.
          properties:
            status:
              const: PENDING_PAYMENT
            payment_state:
              enum: [CONFIRMING, UNKNOWN]
            payment_confirming:
              const: true
            closing_payment:
              const: false
            paid_at:
              const: null
            expired_at:
              const: null
        - type: object
          description: Pending order whose latest payment attempt closed safely.
          properties:
            status:
              const: PENDING_PAYMENT
            payment_state:
              const: CLOSED
            payment_confirming:
              const: false
            closing_payment:
              const: false
            paid_at:
              const: null
            expired_at:
              const: null
        - type: object
          description: Pending order past its deadline while an unfinished payment is converging.
          properties:
            status:
              const: PENDING_PAYMENT
            payment_state:
              enum: [CREATING, PREPAY_CREATED, CONFIRMING, UNKNOWN]
            payment_confirming:
              const: true
            closing_payment:
              const: true
            paid_at:
              const: null
            expired_at:
              const: null
        - type: object
          description: Confirmed order backed by authoritative payment success.
          properties:
            status:
              const: CONFIRMED
            payment_state:
              const: SUCCESS
            payment_confirming:
              const: false
            closing_payment:
              const: false
            paid_at:
              type: string
              format: date-time
            expired_at:
              const: null
        - type: object
          description: Expired order released only after no payment or a safely closed attempt.
          properties:
            status:
              const: EXPIRED
            payment_state:
              enum: [null, CLOSED]
            payment_confirming:
              const: false
            closing_payment:
              const: false
            paid_at:
              const: null
            expired_at:
              type: string
              format: date-time
        - type: object
          description: Payment exception after authoritative payment success.
          properties:
            status:
              const: PAYMENT_EXCEPTION
            payment_state:
              const: SUCCESS
            payment_confirming:
              const: false
            closing_payment:
              const: false
            paid_at:
              type: string
              format: date-time
            expired_at:
              const: null
        - type: object
          description: Payment exception whose authority remains unknown.
          properties:
            status:
              const: PAYMENT_EXCEPTION
            payment_state:
              const: UNKNOWN
            payment_confirming:
              const: false
            closing_payment:
              const: false
            paid_at:
              const: null
            expired_at:
              const: null
      required:
        - id
        - order_number
        - status
        - slot_id
        - venue
        - pitch
        - starts_at
        - ends_at
        - duration_minutes
        - price_cents
        - currency
        - contact
        - created_at
        - expires_at
        - expired_at
        - cancellation_summary
        - payment_state
        - payment_confirming
        - closing_payment
        - paid_at
        - detail_path
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
          minLength: 1
        status:
          type: string
          enum: [PENDING_PAYMENT, CONFIRMED, EXPIRED, PAYMENT_EXCEPTION]
        slot_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/OrderVenue'
        pitch:
          $ref: '#/components/schemas/PhysicalPitch'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
        price_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          const: CNY
        contact:
          $ref: '#/components/schemas/OrderContact'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expired_at:
          type: [string, 'null']
          format: date-time
        cancellation_summary:
          type: string
          minLength: 1
        payment_state:
          type: [string, 'null']
          enum: [CREATING, PREPAY_CREATED, CONFIRMING, SUCCESS, CLOSED, UNKNOWN, null]
        payment_confirming:
          type: boolean
        closing_payment:
          type: boolean
        paid_at:
          type: [string, 'null']
          format: date-time
        detail_path:
          type: string
          pattern: '^/api/v1/orders/[0-9a-f-]{36}$'
    ConfirmedOrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderDetail'
        - type: object
          properties:
            status:
              const: CONFIRMED
    PaymentAuthorityUnresolvedOrder:
      allOf:
        - $ref: '#/components/schemas/OrderDetail'
        - oneOf:
            - type: object
              properties:
                status:
                  const: PENDING_PAYMENT
                payment_state:
                  enum: [CREATING, PREPAY_CREATED, CONFIRMING, UNKNOWN]
            - type: object
              properties:
                status:
                  const: PAYMENT_EXCEPTION
                payment_state:
                  const: UNKNOWN
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        pitch_type:
          type: string
          minLength: 1
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        current_checkout:
          $ref: '#/components/schemas/Checkout'
        future_blockers:
          $ref: '#/components/schemas/PitchFutureBlockers'
        latest_configuration:
          $ref: '#/components/schemas/PitchConfiguration'
        current_facility_version:
          type: integer
          minimum: 1
        current_revision_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
        claim_candidate:
          $ref: '#/components/schemas/VenueOnboardingCandidate'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - PITCH_TYPE_NOT_SUPPORTED
            - DATE_OUT_OF_RANGE
            - VENUE_NOT_FOUND
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
            - PRIMARY_VENUE_MISCONFIGURED
            - VENUE_DIRECTORY_MISCONFIGURED
            - AUTH_REQUIRED
            - WECHAT_LOGIN_FAILED
            - PHONE_AUTH_REQUIRED
            - PHONE_AUTH_UNAVAILABLE
            - PHONE_AUTH_FAILED
            - INVALID_CONTACT
            - SLOT_NOT_AVAILABLE
            - PRICE_CHANGED
            - IDEMPOTENCY_KEY_REUSED
            - ORDER_NOT_FOUND
            - ORDER_EXPIRED
            - PAYMENT_CREATE_FAILED
            - PAYMENT_EXCEPTION
            - INVENTORY_FORBIDDEN
            - PITCH_NOT_FOUND
            - SLOT_NOT_FOUND
            - SLOT_TIME_CONFLICT
            - INVENTORY_VERSION_CONFLICT
            - INVENTORY_SLOT_READ_ONLY
            - REQUEST_IN_PROGRESS
            - CONFIGURATION_CHANGED
            - PITCH_NAME_CONFLICT
            - PITCH_FORMAT_IMMUTABLE
            - PITCH_HAS_BUSINESS_HISTORY
            - PITCH_DEACTIVATE_BLOCKED
            - LAST_ACTIVE_PITCH_REQUIRED
            - INVALID_PLAYERS_PER_SIDE
            - INVALID_CUSTOM_NAME
            - DUPLICATE_PITCH_CHANGE
            - VENUE_PROFILE_VERSION_CONFLICT
            - VENUE_PROFILE_VALIDATION_FAILED
            - POSSIBLE_DUPLICATE_VENUE
            - ONBOARDING_EVIDENCE_REQUIRED
            - ONBOARDING_EVIDENCE_INVALID
            - ONBOARDING_APPLICATION_EXISTS
            - ONBOARDING_APPLICATION_NOT_FOUND
            - ONBOARDING_APPLICATION_STATE_CHANGED
            - PLATFORM_AUTH_REQUIRED
            - PLATFORM_AUTH_INVALID
            - PLATFORM_CSRF_INVALID
            - PLATFORM_ROLE_REQUIRED
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    PriceChangedErrorDetails:
      type: object
      additionalProperties: false
      required: [current_checkout]
      properties:
        current_checkout:
          $ref: '#/components/schemas/Checkout'
    PriceChangedError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code, details]
              properties:
                code:
                  type: string
                  enum: [PRICE_CHANGED]
                details:
                  $ref: '#/components/schemas/PriceChangedErrorDetails'
    OrderConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [SLOT_NOT_AVAILABLE, IDEMPOTENCY_KEY_REUSED]
