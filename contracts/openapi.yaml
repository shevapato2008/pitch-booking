                share: {const: null}
                public_view:
                  type: object
                  properties: {state: {const: CANCELLED}, state_reason: {const: CAPTAIN_CANCELLED}}
            - properties:
                persisted_status: {enum: [DRAFT, PUBLISHED]}
                state: {const: CANCELLED}
