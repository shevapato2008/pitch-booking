        time_zone:
          type: string
          pattern: '^[A-Za-z]+(?:[._+-][A-Za-z0-9]+)*(?:/[A-Za-z0-9._+-]+)+$'
          description: IANA time-zone identifier from venue authority.
    OpenGameEntry:
      description: Any stored game not CANCELLED takes MANAGE precedence, including terminal order projections; otherwise an eligible order is CREATE and all other cases are NONE. Historical stored-CANCELLED games do not block CREATE.
      discriminator: {propertyName: entry}
      oneOf:
        - type: object
          additionalProperties: false
          required: [entry, order, game_id, blocked_reason]
          properties:
            entry: {type: string, const: CREATE}
            order: {$ref: '#/components/schemas/OpenGameOrderSummary'}
            game_id: {type: 'null'}
            blocked_reason: {type: 'null'}
        - type: object
          additionalProperties: false
          required: [entry, order, game_id, blocked_reason]
          properties:
            entry: {type: string, const: MANAGE}
            order: {type: 'null'}
            game_id: {type: string, format: uuid}
            blocked_reason: {type: 'null'}
        - type: object
          additionalProperties: false
          required: [entry, order, game_id, blocked_reason]
          properties:
            entry: {type: string, const: NONE}
            order: {type: 'null'}
            game_id: {type: 'null'}
            blocked_reason: {type: string, const: ORDER_NOT_ELIGIBLE}
