openapi: 3.1.0
info:
  title: Pitch Booking API
  version: 1.0.0
  description: Wire contract for venue browsing, WeChat authentication, checkout, and orders.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                HealthOk:
                  value:
                    status: ok
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/primary:
    get:
      operationId: getPrimaryVenue
      responses:
        '200':
          description: Primary venue details.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
              examples:
                PrimaryVenue:
                  externalValue: './examples/venue-primary.json'
        '500':
          description: Primary venue configuration or internal failure.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [PRIMARY_VENUE_MISCONFIGURED, INTERNAL_ERROR]
              examples:
                PrimaryVenueMisconfigured:
                  externalValue: './examples/error-primary-venue-misconfigured.json'
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/map:
    get:
      operationId: getVenueMap
      responses:
        '200':
          description: Stable public map directory ordered by sort order, name, and venue ID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueMapResponse'
              examples:
                VenueMap:
                  externalValue: './examples/venue-map.json'
        '500':
          description: The public venue directory is empty, inconsistent, or failed internally.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [VENUE_DIRECTORY_MISCONFIGURED, INTERNAL_ERROR]
              examples:
                VenueDirectoryMisconfigured:
                  externalValue: './examples/error-venue-directory-misconfigured.json'
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/{venue_id}:
    get:
      operationId: getVenueDetail
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public venue detail discriminated by booking mode.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueDetail'
              examples:
                OnlineVenueDetail:
                  externalValue: './examples/venue-online-detail.json'
                DirectoryVenueDetail:
                  externalValue: './examples/venue-directory-detail.json'
        '404':
          description: Venue does not exist or is not publicly listed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: VENUE_NOT_FOUND
              examples:
                VenueNotFound:
                  externalValue: './examples/error-venue-not-found.json'
        '500':
          description: Internal service failure.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INTERNAL_ERROR
              examples:
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/{venue_id}/availability:
    get:
      operationId: getVenueAvailability
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: pitch_type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PitchTypeCode'
      responses:
        '200':
          description: Availability for a venue, date, and pitch type.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                AvailabilityReady:
                  externalValue: './examples/availability-ready.json'
                AvailabilityEmpty:
                  externalValue: './examples/availability-empty.json'
        '404':
          description: Venue does not exist or is not enabled for online booking.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: VENUE_NOT_FOUND
              examples:
                VenueNotFound:
                  externalValue: './examples/error-venue-not-found.json'
        '422':
          description: Request parameters are invalid or outside supported bounds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [INVALID_ARGUMENT, PITCH_TYPE_NOT_SUPPORTED, DATE_OUT_OF_RANGE]
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
                PitchTypeNotSupported:
                  externalValue: './examples/error-pitch-type-not-supported.json'
                DateOutOfRange:
                  externalValue: './examples/error-date-out-of-range.json'
        '500':
          description: Internal service failure.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INTERNAL_ERROR
              examples:
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/auth/wechat/session:
    post:
      operationId: createWeChatSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatCodeRequest'
      responses:
        '200':
          description: Business session created from a WeChat login code.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeChatSession'
              examples:
                WeChatSession:
                  externalValue: './examples/wechat-session.json'
        '422':
          description: Request body is invalid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INVALID_ARGUMENT
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
        '502':
          description: WeChat login code exchange failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: WECHAT_LOGIN_FAILED
              examples:
                WeChatLoginFailed:
                  externalValue: './examples/error-wechat-login-failed.json'
  /api/v1/auth/wechat/phone:
    post:
      operationId: verifyWeChatPhone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatCodeRequest'
      responses:
        '200':
          description: Phone number verified from a WeChat phone code.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerification'
              examples:
                PhoneVerified:
                  externalValue: './examples/phone-verified.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '422':
          description: Request body is invalid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INVALID_ARGUMENT
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
        '502':
          description: WeChat phone code exchange failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: PHONE_AUTH_FAILED
              examples:
                PhoneAuthFailed:
                  externalValue: './examples/error-phone-auth-failed.json'
        '503':
          description: WeChat phone capability is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: PHONE_AUTH_UNAVAILABLE
              examples:
                PhoneAuthUnavailable:
                  externalValue: './examples/error-phone-auth-unavailable.json'
  /api/v1/slots/{slot_id}/checkout:
    get:
      operationId: getSlotCheckout
      security:
        - bearerAuth: []
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current authoritative checkout snapshot for the slot and user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
              examples:
                CheckoutReady:
                  externalValue: './examples/checkout-ready.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '404':
          description: Venue does not exist or is not enabled for online booking.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: VENUE_NOT_FOUND
              examples:
                VenueNotFound:
                  externalValue: './examples/error-venue-not-found.json'
        '409':
          description: Slot is no longer available for checkout.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SLOT_NOT_AVAILABLE
              examples:
                SlotNotAvailable:
                  externalValue: './examples/error-slot-not-available.json'
  /api/v1/orders:
    post:
      operationId: createOrder
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: An existing pending order for this user and slot is returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                ExistingPendingOrder:
                  externalValue: './examples/order-pending.json'
        '201':
          description: Pending order created and slot locked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                PendingOrderCreated:
                  externalValue: './examples/order-pending.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '404':
          description: Venue does not exist or is not enabled for online booking.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: VENUE_NOT_FOUND
              examples:
                VenueNotFound:
                  externalValue: './examples/error-venue-not-found.json'
        '409':
          description: Slot, checkout version, or idempotency key conflicts with current state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - oneOf:
                      - $ref: '#/components/schemas/PriceChangedError'
                      - $ref: '#/components/schemas/OrderConflictError'
              examples:
                SlotNotAvailable:
                  externalValue: './examples/error-slot-not-available.json'
                PriceChanged:
                  externalValue: './examples/error-price-changed.json'
                IdempotencyKeyReused:
                  externalValue: './examples/error-idempotency-key-reused.json'
        '422':
          description: A verified phone or a valid contact name is required.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [PHONE_AUTH_REQUIRED, INVALID_CONTACT]
              examples:
                PhoneAuthRequired:
                  externalValue: './examples/error-phone-auth-required.json'
                InvalidContact:
                  externalValue: './examples/error-invalid-contact.json'
  /api/v1/orders/{order_id}:
    get:
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail owned by the authenticated user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                PendingOrder:
                  externalValue: './examples/order-pending.json'
                ExpiredOrder:
                  externalValue: './examples/order-expired.json'
                ConfirmedOrder:
                  externalValue: './examples/order-confirmed.json'
                PaymentExceptionOrder:
                  externalValue: './examples/order-payment-exception.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '404':
          description: Order does not exist or is not owned by this user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: ORDER_NOT_FOUND
              examples:
                OrderNotFound:
                  externalValue: './examples/error-order-not-found.json'
  /api/v1/orders/{order_id}/pay:
    post:
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      responses:
        '200':
          description: An existing prepay result is replayed, or the order was already confirmed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PaymentPrepayCreatedResponse'
                  - $ref: '#/components/schemas/PaymentAlreadyConfirmedResponse'
              examples:
                PrepayReplayed:
                  externalValue: './examples/payment-prepay-created.json'
                AlreadyConfirmed:
                  externalValue: './examples/payment-already-confirmed.json'
        '201':
          description: A new prepay was created and can be launched in the cashier.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPrepayCreatedResponse'
              examples:
                PrepayCreated:
                  externalValue: './examples/payment-prepay-created.json'
        '202':
          description: Payment authority remains unresolved and no launch parameters are available.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmingResponse'
              examples:
                PaymentConfirming:
                  externalValue: './examples/payment-confirming.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '404':
          description: Order is unavailable to this user, or its venue is not enabled for online booking.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [ORDER_NOT_FOUND, VENUE_NOT_FOUND]
              examples:
                OrderNotFound:
                  externalValue: './examples/error-order-not-found.json'
                VenueNotFound:
                  externalValue: './examples/error-venue-not-found.json'
        '409':
          description: The order cannot enter or resume payment in its current state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [ORDER_EXPIRED, PAYMENT_EXCEPTION, IDEMPOTENCY_KEY_REUSED]
              examples:
                OrderExpired:
                  externalValue: './examples/error-order-expired.json'
                PaymentException:
                  externalValue: './examples/error-payment-exception.json'
                IdempotencyKeyReused:
                  externalValue: './examples/error-idempotency-key-reused.json'
        '503':
          description: The payment provider definitively rejected prepay creation.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: PAYMENT_CREATE_FAILED
              examples:
                PaymentCreateFailed:
                  externalValue: './examples/error-payment-create-failed.json'
  /api/v1/orders/{order_id}/payments/{payment_id}/reconcile:
    post:
      operationId: reconcilePayment
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment authority reached a terminal state; the latest order projection is returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                ConfirmedOrder:
                  externalValue: './examples/order-confirmed.json'
        '202':
          description: Payment authority remains unresolved and the confirming projection is returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmingResponse'
              examples:
                PaymentConfirming:
                  externalValue: './examples/payment-confirming.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '404':
          description: Order or payment does not exist, or is not owned by this user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: ORDER_NOT_FOUND
              examples:
                OrderNotFound:
                  externalValue: './examples/error-order-not-found.json'
  /api/v1/admin/venues/{venue_id}/inventory:
    get:
      operationId: getAdminVenueInventory
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: local_date
          in: query
          required: true
          schema: {type: string, format: date}
        - name: pitch_id
          in: query
          required: false
          schema:
            type: [string, 'null']
            format: uuid
      responses:
        '200':
          description: Authorized venue, ordered pitches, and selected-pitch inventory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminInventory'}
              examples:
                Ready:
                  externalValue: './examples/admin-inventory-ready.json'
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Inventory permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Venue or pitch not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: Date or query invalid, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/admin/venues/{venue_id}/inventory/slots:
    post:
      operationId: createAdminInventorySlot
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAdminInventorySlot'}
      responses:
        '201':
          description: Available future slot created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminInventorySlot'}
              examples:
                Created:
                  externalValue: './examples/admin-inventory-slot.json'
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Inventory permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Venue or pitch not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Idempotency or time conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: Slot input invalid, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /api/v1/admin/venues/{venue_id}/inventory/slots/{slot_id}:
    put:
      operationId: updateAdminInventorySlot
      security:
        - bearerAuth: []
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slot_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAdminInventorySlot'}
      responses:
        '200':
          description: Slot price and availability state updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminInventorySlot'}
              examples:
                Updated:
                  externalValue: './examples/admin-inventory-slot.json'
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '403': {description: Inventory permission required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '404': {description: Venue or slot not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: Version conflict or immutable slot, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '422': {description: Slot update invalid, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RequestId:
      description: Identifier used to trace the request.
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    AdminInventoryVenue:
      type: object
      additionalProperties: false
      required: [id, name, timezone]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1}
        timezone: {type: string, minLength: 1}
    AdminInventoryPitch:
      type: object
      additionalProperties: false
      required: [id, name, display_name, pitch_type, players_per_side]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1}
        display_name: {type: string, minLength: 1}
        pitch_type: {type: string, enum: [FIVE_A_SIDE, SEVEN_A_SIDE]}
        players_per_side: {type: integer, enum: [5, 7]}
    AdminInventoryWindow:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      properties:
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
    AdminInventorySlot:
      type: object
      additionalProperties: false
      required: [id, pitch_id, starts_at, ends_at, start_time, end_time, price_cents, status, checkout_version, editable, read_only_reason]
      properties:
        id: {type: string, format: uuid}
        pitch_id: {type: string, format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        start_time: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}
        end_time: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}
        price_cents: {type: integer, minimum: 0}
        status: {type: string, enum: [AVAILABLE, LOCKED, BOOKED, CLOSED]}
        checkout_version: {type: integer, minimum: 1}
        editable: {type: boolean}
        read_only_reason:
          type: [string, 'null']
          enum: [HELD_FOR_PAYMENT, ALREADY_BOOKED, TIME_PASSED, null]
    AdminInventory:
      type: object
      additionalProperties: false
      required: [venue, local_date, availability_window, pitches, selected_pitch_id, slots, generated_at]
      properties:
        venue: {$ref: '#/components/schemas/AdminInventoryVenue'}
        local_date: {type: string, format: date}
        availability_window: {$ref: '#/components/schemas/AdminInventoryWindow'}
        pitches:
          type: array
          items: {$ref: '#/components/schemas/AdminInventoryPitch'}
        selected_pitch_id: {type: string, format: uuid}
        slots:
          type: array
          items: {$ref: '#/components/schemas/AdminInventorySlot'}
        generated_at: {type: string, format: date-time}
    CreateAdminInventorySlot:
      type: object
      additionalProperties: false
      required: [pitch_id, local_date, start_time, end_time, price_cents]
      properties:
        pitch_id: {type: string, format: uuid}
        local_date: {type: string, format: date}
        start_time: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}
        end_time: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}
        price_cents: {type: integer, minimum: 0}
    UpdateAdminInventorySlot:
      type: object
      additionalProperties: false
      required: [price_cents, status, expected_checkout_version]
      properties:
        price_cents: {type: integer, minimum: 0}
        status: {type: string, enum: [AVAILABLE, CLOSED]}
        expected_checkout_version: {type: integer, minimum: 1}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    PitchTypeCode:
      type: string
      enum: [FIVE_A_SIDE, SEVEN_A_SIDE]
    AvailabilityWindow:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    VenueImage:
      type: object
      additionalProperties: false
      required: [url, alt, role, sort_order]
      properties:
        url:
          type: string
          format: uri
          description: ASCII dotted domain over lowercase HTTPS; no userinfo or port; non-ASCII octets must be percent-encoded.
          pattern: >-
            ^https://(?=[^/?#]{1,253}(?:[/?#]|$))[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.[A-Za-z](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:/(?:[A-Za-z0-9._~!$&'()*+,;=:@/-]|%[0-9A-Fa-f]{2})*)?(?:\?(?:[A-Za-z0-9._~!$&'()*+,;=:@/?-]|%[0-9A-Fa-f]{2})*)?(?:#(?:[A-Za-z0-9._~!$&'()*+,;=:@/?-]|%[0-9A-Fa-f]{2})*)?$
        alt:
          type: string
          minLength: 1
        role:
          type: string
          enum: [COVER, GALLERY]
        sort_order:
          type: integer
          minimum: 0
    Facility:
      type: object
      additionalProperties: false
      required: [code, name, sort_order]
      properties:
        code:
          type: string
          enum: [LIGHTING, CHANGING_ROOM, DRINKING_WATER, PARKING]
        name:
          type: string
          minLength: 1
        sort_order:
          type: integer
          minimum: 0
    PitchType:
      type: object
      additionalProperties: false
      required: [code, name, sort_order]
      properties:
        code:
          $ref: '#/components/schemas/PitchTypeCode'
        name:
          type: string
          minLength: 1
        sort_order:
          type: integer
          minimum: 0
    PublicPitchTypeCode:
      type: string
      enum: [FIVE_A_SIDE, SEVEN_A_SIDE, ELEVEN_A_SIDE]
    VenueTransitStop:
      type: object
      additionalProperties: false
      required: [kind, name, lines, distance_meters, distance_basis]
      properties:
        kind:
          type: string
          enum: [SUBWAY, BUS]
        name:
          type: string
          minLength: 1
        lines:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        distance_meters:
          type: integer
          minimum: 0
        distance_basis:
          type: string
          enum: [STRAIGHT_LINE, MAP_VERIFIED]
    VenueMapItem:
