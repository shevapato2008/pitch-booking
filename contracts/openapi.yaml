  /api/v1/venue-onboarding/evidence/{evidence_id}/complete:
    post:
      operationId: completeVenueOnboardingEvidence
      description: >-
        The server streams the owner-bound private object, computes authoritative size and SHA-256 under the
        evidence-kind hard limit, and verifies actual JPEG or PNG decode or the PDF signature. Client metadata is
        non-authoritative. The first completion and an idempotent replay both return 200; reusing the same key for
        a different request returns 409. The closed response never exposes a private object key or reviewer-only material.
      security:
        - bearerAuth: []
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Evidence verified and closed, or the authoritative closed result replayed.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueOnboardingEvidenceClosed'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '404':
          description: Owner-bound evidence reservation was not found.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: {const: ONBOARDING_APPLICATION_NOT_FOUND}
        '409':
          description: Evidence state changed or the idempotency key was reused with a different request.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: {enum: [ONBOARDING_APPLICATION_STATE_CHANGED, IDEMPOTENCY_KEY_REUSED]}
              examples:
                IdempotencyKeyReused: {externalValue: './examples/error-idempotency-key-reused.json'}
        '422':
          description: Private evidence bytes fail the authoritative kind, size, digest, decode, or signature checks.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: {enum: [INVALID_ARGUMENT, ONBOARDING_EVIDENCE_INVALID]}
              examples:
                InvalidArgument: {externalValue: './examples/error-invalid-argument.json'}
        '503':
          description: Service is temporarily unavailable.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
