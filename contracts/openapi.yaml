          type: array
          minItems: 17
          maxItems: 17
          uniqueItems: true
          items: {$ref: '#/components/schemas/VenueProfileCatalogItem'}
        rejection_reason_catalog:
          type: array
          minItems: 9
          maxItems: 9
          uniqueItems: true
          items: {$ref: '#/components/schemas/VenueProfileReasonCatalogItem'}
