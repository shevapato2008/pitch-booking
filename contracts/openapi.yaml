openapi: 3.1.0
info:
  title: Pitch Booking API
  version: 1.0.0
  description: Wire contract for venue browsing, WeChat authentication, checkout, and orders.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                HealthOk:
                  value:
                    status: ok
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/primary:
    get:
      operationId: getPrimaryVenue
      responses:
        '200':
          description: Primary venue details.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
              examples:
                PrimaryVenue:
                  externalValue: './examples/venue-primary.json'
        '500':
          description: Primary venue configuration or internal failure.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [PRIMARY_VENUE_MISCONFIGURED, INTERNAL_ERROR]
              examples:
                PrimaryVenueMisconfigured:
                  externalValue: './examples/error-primary-venue-misconfigured.json'
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/map:
    get:
      operationId: getVenueMap
      responses:
        '200':
          description: Stable public map directory ordered by sort order, name, and venue ID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueMapResponse'
              examples:
                VenueMap:
                  externalValue: './examples/venue-map.json'
        '500':
          description: The public venue directory is empty, inconsistent, or failed internally.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [VENUE_DIRECTORY_MISCONFIGURED, INTERNAL_ERROR]
              examples:
                VenueDirectoryMisconfigured:
                  externalValue: './examples/error-venue-directory-misconfigured.json'
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/{venue_id}:
    get:
      operationId: getVenueDetail
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public venue detail discriminated by booking mode.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueDetail'
              examples:
                OnlineVenueDetail:
                  externalValue: './examples/venue-online-detail.json'
                DirectoryVenueDetail:
                  externalValue: './examples/venue-directory-detail.json'
        '404':
          description: Venue does not exist or is not publicly listed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: VENUE_NOT_FOUND
              examples:
                VenueNotFound:
                  externalValue: './examples/error-venue-not-found.json'
        '500':
          description: Internal service failure.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INTERNAL_ERROR
              examples:
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/{venue_id}/availability:
    get:
      operationId: getVenueAvailability
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: pitch_type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PitchTypeCode'
      responses:
        '200':
          description: Availability for a venue, date, and pitch type.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                AvailabilityReady:
                  externalValue: './examples/availability-ready.json'
                AvailabilityEmpty:
                  externalValue: './examples/availability-empty.json'
        '404':
          description: Venue does not exist or is not enabled for online booking.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: VENUE_NOT_FOUND
              examples:
                VenueNotFound:
                  externalValue: './examples/error-venue-not-found.json'
        '422':
          description: Request parameters are invalid or outside supported bounds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [INVALID_ARGUMENT, PITCH_TYPE_NOT_SUPPORTED, DATE_OUT_OF_RANGE]
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
                PitchTypeNotSupported:
                  externalValue: './examples/error-pitch-type-not-supported.json'
                DateOutOfRange:
                  externalValue: './examples/error-date-out-of-range.json'
        '500':
          description: Internal service failure.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INTERNAL_ERROR
              examples:
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/{venue_id}/fulfillment/orders:
    get:
      operationId: listVenueFulfillmentOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: service_date
          in: query
          required: false
          schema: {type: string, format: date}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Authorized venue fulfillment orders for one Shanghai service date.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueFulfillmentOrdersResponse'}
              examples:
                FulfillmentOrders: {externalValue: './examples/venue-fulfillment-orders.json'}
        '401':
          description: Business session is missing, invalid, or expired.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: AUTH_REQUIRED}}}}
              examples:
                AuthRequired: {externalValue: './examples/error-auth-required.json'}
        '404':
          description: Venue or authorized fulfillment resource was not found.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: ORDER_NOT_FOUND}}}}
              examples:
                OrderNotFound: {externalValue: './examples/error-order-not-found.json'}
        '422':
          description: Service date, limit, or cursor is invalid.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: INVALID_ARGUMENT}}}}
              examples:
                InvalidArgument: {externalValue: './examples/error-invalid-argument.json'}
        '503':
          description: Fulfillment service is temporarily unavailable.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}
              examples:
                ServiceUnavailable: {externalValue: './examples/error-service-unavailable.json'}
  /api/v1/venues/{venue_id}/fulfillment/orders/{order_id}/check-in:
    post:
      operationId: checkInVenueOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: order_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order checked in, or the same authoritative check-in replayed.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueFulfillmentOrder'}
              examples:
                CheckedInOrder: {externalValue: './examples/venue-order-checked-in.json'}
        '401':
          description: Business session is missing, invalid, or expired.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: AUTH_REQUIRED}}}}
              examples:
                AuthRequired: {externalValue: './examples/error-auth-required.json'}
        '404':
          description: Venue order was not found for this authorized manager.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: ORDER_NOT_FOUND}}}}
              examples:
                OrderNotFound: {externalValue: './examples/error-order-not-found.json'}
        '409':
          description: Order state or idempotency state changed.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {enum: [ORDER_STATE_CHANGED, IDEMPOTENCY_KEY_REUSED]}}}}
              examples:
                OrderStateChanged: {externalValue: './examples/error-order-state-changed.json'}
                IdempotencyKeyReused: {externalValue: './examples/error-idempotency-key-reused.json'}
        '503':
          description: Fulfillment service is temporarily unavailable.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}
              examples:
                ServiceUnavailable: {externalValue: './examples/error-service-unavailable.json'}
  /api/v1/venues/{venue_id}/fulfillment/orders/{order_id}/complete:
    post:
      operationId: completeVenueOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: order_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order completed, or the same authoritative completion replayed.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueFulfillmentOrder'}
              examples:
                CompletedOrder: {externalValue: './examples/venue-order-completed.json'}
        '401':
          description: Business session is missing, invalid, or expired.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: AUTH_REQUIRED}}}}
              examples:
                AuthRequired: {externalValue: './examples/error-auth-required.json'}
        '404':
          description: Venue order was not found for this authorized manager.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: ORDER_NOT_FOUND}}}}
              examples:
                OrderNotFound: {externalValue: './examples/error-order-not-found.json'}
        '409':
          description: Order state or idempotency state changed.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {enum: [ORDER_STATE_CHANGED, IDEMPOTENCY_KEY_REUSED]}}}}
              examples:
                OrderStateChanged: {externalValue: './examples/error-order-state-changed.json'}
                IdempotencyKeyReused: {externalValue: './examples/error-idempotency-key-reused.json'}
        '503':
          description: Fulfillment service is temporarily unavailable.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}
              examples:
                ServiceUnavailable: {externalValue: './examples/error-service-unavailable.json'}
  /api/v1/venues/{venue_id}/fulfillment/orders/{order_id}/refund:
    post:
      operationId: refundVenueOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: order_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VenueRefundRequest'}
      responses:
        '200':
          description: Refund already reached its authoritative result.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundAccepted'}
              examples:
                RefundAccepted: {externalValue: './examples/refund-accepted.json'}
        '202':
          description: Full refund accepted for asynchronous convergence.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundAccepted'}
              examples:
                RefundAccepted: {externalValue: './examples/refund-accepted.json'}
        '401':
          description: Business session is missing, invalid, or expired.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: AUTH_REQUIRED}}}}
              examples:
                AuthRequired: {externalValue: './examples/error-auth-required.json'}
        '404':
          description: Venue order was not found for this authorized manager.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: ORDER_NOT_FOUND}}}}
              examples:
                OrderNotFound: {externalValue: './examples/error-order-not-found.json'}
        '409':
          description: Order, refund, or idempotency state conflicts with this request.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {enum: [ORDER_STATE_CHANGED, IDEMPOTENCY_KEY_REUSED, REFUND_IN_PROGRESS]}}}}
              examples:
                OrderStateChanged: {externalValue: './examples/error-order-state-changed.json'}
                IdempotencyKeyReused: {externalValue: './examples/error-idempotency-key-reused.json'}
                RefundInProgress: {externalValue: './examples/error-refund-in-progress.json'}
        '422':
          description: Venue refund reason is invalid.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: INVALID_ARGUMENT}}}}
              examples:
                InvalidArgument: {externalValue: './examples/error-invalid-argument.json'}
        '503':
          description: Refund service is temporarily unavailable.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}
              examples:
                ServiceUnavailable: {externalValue: './examples/error-service-unavailable.json'}
  /api/v1/auth/wechat/session:
    post:
      operationId: createWeChatSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatCodeRequest'
      responses:
        '200':
          description: Business session created from a WeChat login code.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeChatSession'
              examples:
                WeChatSession:
                  externalValue: './examples/wechat-session.json'
        '422':
          description: Request body is invalid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INVALID_ARGUMENT
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
        '502':
          description: WeChat login code exchange failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: WECHAT_LOGIN_FAILED
              examples:
                WeChatLoginFailed:
                  externalValue: './examples/error-wechat-login-failed.json'
  /api/v1/auth/wechat/phone:
    post:
      operationId: verifyWeChatPhone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatCodeRequest'
      responses:
        '200':
          description: Phone number verified from a WeChat phone code.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerification'
              examples:
                PhoneVerified:
                  externalValue: './examples/phone-verified.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '422':
          description: Request body is invalid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INVALID_ARGUMENT
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
        '502':
          description: WeChat phone code exchange failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: PHONE_AUTH_FAILED
              examples:
                PhoneAuthFailed:
                  externalValue: './examples/error-phone-auth-failed.json'
        '503':
          description: WeChat phone capability is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: PHONE_AUTH_UNAVAILABLE
              examples:
                PhoneAuthUnavailable:
                  externalValue: './examples/error-phone-auth-unavailable.json'
