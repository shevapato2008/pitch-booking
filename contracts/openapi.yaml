                state_reason: {const: null}
                allowed_actions: {const: {can_edit: true, can_publish: false, can_share: true, can_cancel: true, can_preview: true, can_manage_attendance: false}}
                share: {$ref: '#/components/schemas/OpenGameShare'}
                public_view:
                  type: object
                  properties: {state: {const: PUBLISHED}, state_reason: {const: null}}
            - properties:
                persisted_status: {const: PUBLISHED}
                state: {const: PUBLISHED}
                state_reason: {const: REGISTRATION_DEADLINE_PASSED}
                allowed_actions: {const: {can_edit: true, can_publish: false, can_share: true, can_cancel: true, can_preview: true, can_manage_attendance: false}}
                share: {$ref: '#/components/schemas/OpenGameShare'}
                public_view:
                  type: object
                  properties: {state: {const: PUBLISHED}, state_reason: {const: REGISTRATION_DEADLINE_PASSED}}
            - properties:
                persisted_status: {enum: [DRAFT, PUBLISHED]}
                state: {const: SUSPENDED}
                state_reason: {enum: [ORDER_CANCELLATION_PENDING, ORDER_PAYMENT_EXCEPTION, ORDER_REFUND_PENDING, ORDER_REFUND_FAILED]}
                allowed_actions: {const: {can_edit: false, can_publish: false, can_share: false, can_cancel: true, can_preview: true, can_manage_attendance: false}}
                share: {const: null}
