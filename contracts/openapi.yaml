openapi: 3.1.0
info:
  title: Pitch Booking API
  version: 1.0.0
  description: Wire contract for venue browsing, WeChat authentication, checkout, and orders.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                HealthOk:
                  value:
                    status: ok
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/primary:
    get:
      operationId: getPrimaryVenue
      responses:
        '200':
          description: Primary venue details.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
              examples:
                PrimaryVenue:
                  externalValue: './examples/venue-primary.json'
        '500':
          description: Primary venue configuration or internal failure.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [PRIMARY_VENUE_MISCONFIGURED, INTERNAL_ERROR]
              examples:
                PrimaryVenueMisconfigured:
                  externalValue: './examples/error-primary-venue-misconfigured.json'
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/venues/{venue_id}/availability:
    get:
      operationId: getVenueAvailability
      parameters:
        - name: venue_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: pitch_type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PitchTypeCode'
      responses:
        '200':
          description: Availability for a venue, date, and pitch type.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
              examples:
                AvailabilityReady:
                  externalValue: './examples/availability-ready.json'
                AvailabilityEmpty:
                  externalValue: './examples/availability-empty.json'
        '404':
          description: Venue does not exist.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: VENUE_NOT_FOUND
              examples:
                VenueNotFound:
                  externalValue: './examples/error-venue-not-found.json'
        '422':
          description: Request parameters are invalid or outside supported bounds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [INVALID_ARGUMENT, PITCH_TYPE_NOT_SUPPORTED, DATE_OUT_OF_RANGE]
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
                PitchTypeNotSupported:
                  externalValue: './examples/error-pitch-type-not-supported.json'
                DateOutOfRange:
                  externalValue: './examples/error-date-out-of-range.json'
        '500':
          description: Internal service failure.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INTERNAL_ERROR
              examples:
                InternalError:
                  externalValue: './examples/error-internal.json'
        '503':
          description: Service is temporarily unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SERVICE_UNAVAILABLE
              examples:
                ServiceUnavailable:
                  externalValue: './examples/error-service-unavailable.json'
  /api/v1/auth/wechat/session:
    post:
      operationId: createWeChatSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatCodeRequest'
      responses:
        '200':
          description: Business session created from a WeChat login code.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeChatSession'
              examples:
                WeChatSession:
                  externalValue: './examples/wechat-session.json'
        '422':
          description: Request body is invalid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INVALID_ARGUMENT
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
        '502':
          description: WeChat login code exchange failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: WECHAT_LOGIN_FAILED
              examples:
                WeChatLoginFailed:
                  externalValue: './examples/error-wechat-login-failed.json'
  /api/v1/auth/wechat/phone:
    post:
      operationId: verifyWeChatPhone
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeChatCodeRequest'
      responses:
        '200':
          description: Phone number verified from a WeChat phone code.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerification'
              examples:
                PhoneVerified:
                  externalValue: './examples/phone-verified.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '422':
          description: Request body is invalid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: INVALID_ARGUMENT
              examples:
                InvalidArgument:
                  externalValue: './examples/error-invalid-argument.json'
        '502':
          description: WeChat phone code exchange failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: PHONE_AUTH_FAILED
              examples:
                PhoneAuthFailed:
                  externalValue: './examples/error-phone-auth-failed.json'
        '503':
          description: WeChat phone capability is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: PHONE_AUTH_UNAVAILABLE
              examples:
                PhoneAuthUnavailable:
                  externalValue: './examples/error-phone-auth-unavailable.json'
  /api/v1/slots/{slot_id}/checkout:
    get:
      operationId: getSlotCheckout
      security:
        - bearerAuth: []
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current authoritative checkout snapshot for the slot and user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
              examples:
                CheckoutReady:
                  externalValue: './examples/checkout-ready.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '409':
          description: Slot is no longer available for checkout.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: SLOT_NOT_AVAILABLE
              examples:
                SlotNotAvailable:
                  externalValue: './examples/error-slot-not-available.json'
  /api/v1/orders:
    post:
      operationId: createOrder
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: An existing pending order for this user and slot is returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                ExistingPendingOrder:
                  externalValue: './examples/order-pending.json'
        '201':
          description: Pending order created and slot locked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                PendingOrderCreated:
                  externalValue: './examples/order-pending.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '409':
          description: Slot, checkout version, or idempotency key conflicts with current state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - oneOf:
                      - $ref: '#/components/schemas/PriceChangedError'
                      - $ref: '#/components/schemas/OrderConflictError'
              examples:
                SlotNotAvailable:
                  externalValue: './examples/error-slot-not-available.json'
                PriceChanged:
                  externalValue: './examples/error-price-changed.json'
                IdempotencyKeyReused:
                  externalValue: './examples/error-idempotency-key-reused.json'
        '422':
          description: A verified phone or a valid contact name is required.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [PHONE_AUTH_REQUIRED, INVALID_CONTACT]
              examples:
                PhoneAuthRequired:
                  externalValue: './examples/error-phone-auth-required.json'
                InvalidContact:
                  externalValue: './examples/error-invalid-contact.json'
  /api/v1/orders/{order_id}:
    get:
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail owned by the authenticated user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                PendingOrder:
                  externalValue: './examples/order-pending.json'
                ExpiredOrder:
                  externalValue: './examples/order-expired.json'
                ConfirmedOrder:
                  externalValue: './examples/order-confirmed.json'
                PaymentExceptionOrder:
                  externalValue: './examples/order-payment-exception.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '404':
          description: Order does not exist or is not owned by this user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: ORDER_NOT_FOUND
              examples:
                OrderNotFound:
                  externalValue: './examples/error-order-not-found.json'
  /api/v1/orders/{order_id}/pay:
    post:
      operationId: createPayment
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      responses:
        '200':
          description: An existing prepay result is replayed, or the order was already confirmed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PaymentPrepayCreatedResponse'
                  - $ref: '#/components/schemas/PaymentAlreadyConfirmedResponse'
              examples:
                PrepayReplayed:
                  externalValue: './examples/payment-prepay-created.json'
        '201':
          description: A new prepay was created and can be launched in the cashier.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPrepayCreatedResponse'
              examples:
                PrepayCreated:
                  externalValue: './examples/payment-prepay-created.json'
        '202':
          description: Payment authority remains unresolved and no launch parameters are available.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmingResponse'
              examples:
                PaymentConfirming:
                  externalValue: './examples/payment-confirming.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '404':
          description: Order does not exist or is not owned by this user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: ORDER_NOT_FOUND
              examples:
                OrderNotFound:
                  externalValue: './examples/error-order-not-found.json'
        '409':
          description: The order cannot enter or resume payment in its current state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            enum: [ORDER_EXPIRED, PAYMENT_EXCEPTION, IDEMPOTENCY_KEY_REUSED]
              examples:
                OrderExpired:
                  externalValue: './examples/error-order-expired.json'
                PaymentException:
                  externalValue: './examples/error-payment-exception.json'
                IdempotencyKeyReused:
                  externalValue: './examples/error-idempotency-key-reused.json'
        '503':
          description: The payment provider definitively rejected prepay creation.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: PAYMENT_CREATE_FAILED
              examples:
                PaymentCreateFailed:
                  externalValue: './examples/error-payment-create-failed.json'
  /api/v1/orders/{order_id}/payments/{payment_id}/reconcile:
    post:
      operationId: reconcilePayment
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment authority reached a terminal state; the latest order projection is returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              examples:
                ConfirmedOrder:
                  externalValue: './examples/order-confirmed.json'
        '202':
          description: Payment authority remains unresolved and the confirming projection is returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmingResponse'
              examples:
                PaymentConfirming:
                  externalValue: './examples/payment-confirming.json'
        '401':
          description: Business session is missing, invalid, or expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: AUTH_REQUIRED
              examples:
                AuthRequired:
                  externalValue: './examples/error-auth-required.json'
        '404':
          description: Order or payment does not exist, or is not owned by this user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code:
                            const: ORDER_NOT_FOUND
              examples:
                OrderNotFound:
                  externalValue: './examples/error-order-not-found.json'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RequestId:
      description: Identifier used to trace the request.
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    PitchTypeCode:
      type: string
      enum: [FIVE_A_SIDE, SEVEN_A_SIDE]
    AvailabilityWindow:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    VenueImage:
      type: object
      additionalProperties: false
      required: [url, alt, role, sort_order]
      properties:
        url:
          type: string
          format: uri
          description: ASCII dotted domain over lowercase HTTPS; no userinfo or port; non-ASCII octets must be percent-encoded.
          pattern: >-
            ^https://(?=[^/?#]{1,253}(?:[/?#]|$))[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.[A-Za-z](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:/(?:[A-Za-z0-9._~!$&'()*+,;=:@/-]|%[0-9A-Fa-f]{2})*)?(?:\?(?:[A-Za-z0-9._~!$&'()*+,;=:@/?-]|%[0-9A-Fa-f]{2})*)?(?:#(?:[A-Za-z0-9._~!$&'()*+,;=:@/?-]|%[0-9A-Fa-f]{2})*)?$
        alt:
          type: string
          minLength: 1
        role:
          type: string
          enum: [COVER, GALLERY]
        sort_order:
          type: integer
          minimum: 0
    Facility:
      type: object
      additionalProperties: false
      required: [code, name, sort_order]
      properties:
        code:
          type: string
          enum: [LIGHTING, CHANGING_ROOM, DRINKING_WATER, PARKING]
        name:
          type: string
          minLength: 1
        sort_order:
          type: integer
          minimum: 0
    PitchType:
      type: object
      additionalProperties: false
      required: [code, name, sort_order]
      properties:
        code:
          $ref: '#/components/schemas/PitchTypeCode'
        name:
          type: string
          minLength: 1
        sort_order:
          type: integer
          minimum: 0
    Venue:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - price_advantage_text
        - timezone
        - business_hours_text
        - address
        - latitude
        - longitude
        - parking_text
        - phone
        - refund_policy_summary
        - images
        - facilities
        - pitch_types
        - availability_window
        - generated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
        price_advantage_text:
          type: string
          minLength: 1
        timezone:
          type: string
          const: Asia/Shanghai
        business_hours_text:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        parking_text:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        refund_policy_summary:
          type: string
          minLength: 1
        images:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VenueImage'
        facilities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Facility'
        pitch_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PitchType'
        availability_window:
          $ref: '#/components/schemas/AvailabilityWindow'
        generated_at:
          type: string
          format: date-time
    Slot:
      type: object
      additionalProperties: false
      required: [id, starts_at, ends_at, price_cents, status, unavailable_reason]
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        price_cents:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [AVAILABLE, TEMPORARILY_LOCKED, BOOKED, CLOSED, EXPIRED]
        unavailable_reason:
          type: [string, 'null']
          enum: [HELD_FOR_PAYMENT, ALREADY_BOOKED, VENUE_CLOSED, TIME_PASSED, null]
      oneOf:
        - type: object
          properties:
            status:
              const: AVAILABLE
            unavailable_reason:
              const: null
        - type: object
          properties:
            status:
              const: TEMPORARILY_LOCKED
            unavailable_reason:
              const: HELD_FOR_PAYMENT
        - type: object
          properties:
            status:
              const: BOOKED
            unavailable_reason:
              const: ALREADY_BOOKED
        - type: object
          properties:
            status:
              const: CLOSED
            unavailable_reason:
              const: VENUE_CLOSED
        - type: object
          properties:
            status:
              const: EXPIRED
            unavailable_reason:
              const: TIME_PASSED
    PitchAvailability:
      type: object
      additionalProperties: false
      required: [id, name, pitch_type, sort_order, slots]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        pitch_type:
          $ref: '#/components/schemas/PitchTypeCode'
        sort_order:
          type: integer
          minimum: 0
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    Availability:
      type: object
      additionalProperties: false
      required:
        - venue_id
        - timezone
        - date
        - pitch_type
        - availability_window
        - pitches
        - generated_at
      properties:
        venue_id:
          type: string
          format: uuid
        timezone:
          type: string
          const: Asia/Shanghai
        date:
          type: string
          format: date
        pitch_type:
          $ref: '#/components/schemas/PitchTypeCode'
        availability_window:
          $ref: '#/components/schemas/AvailabilityWindow'
        pitches:
          type: array
          items:
            $ref: '#/components/schemas/PitchAvailability'
        generated_at:
          type: string
          format: date-time
    WeChatCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 256
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, masked_phone, last_contact_name]
      properties:
        id:
          type: string
          format: uuid
        masked_phone:
          type: [string, 'null']
          pattern: '^1[0-9]{2}\*{4}[0-9]{4}$'
        last_contact_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
    WeChatSession:
      type: object
      additionalProperties: false
      required: [session_token, expires_at, user]
      properties:
        session_token:
          type: string
          minLength: 43
          maxLength: 256
          description: Opaque bearer token containing at least 256 bits of randomness.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/SessionUser'
    PhoneVerification:
      type: object
      additionalProperties: false
      required: [masked_phone, verified_at]
      properties:
        masked_phone:
          type: string
          pattern: '^1[0-9]{2}\*{4}[0-9]{4}$'
        verified_at:
          type: string
          format: date-time
    CheckoutVenue:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    PhysicalPitch:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    CheckoutContact:
      type: object
      additionalProperties: false
      required: [masked_phone, last_contact_name]
      properties:
        masked_phone:
          type: [string, 'null']
          pattern: '^1[0-9]{2}\*{4}[0-9]{4}$'
        last_contact_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
    Checkout:
      type: object
      additionalProperties: false
      required:
        - slot_id
        - venue
        - pitch
        - date
        - starts_at
        - ends_at
        - duration_minutes
        - price_cents
        - currency
        - available
        - cancellation_summary
        - lock_duration_seconds
        - contact
        - checkout_version
      properties:
        slot_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/CheckoutVenue'
        pitch:
          $ref: '#/components/schemas/PhysicalPitch'
        date:
          type: string
          format: date
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
        price_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          const: CNY
        available:
          type: boolean
          const: true
        cancellation_summary:
          type: string
          minLength: 1
        lock_duration_seconds:
          type: integer
          minimum: 1
        contact:
          $ref: '#/components/schemas/CheckoutContact'
        checkout_version:
          type: integer
          minimum: 1
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [slot_id, checkout_version, contact_name]
      properties:
        slot_id:
          type: string
          format: uuid
        checkout_version:
          type: integer
          minimum: 1
        contact_name:
          type: string
          minLength: 1
          maxLength: 40
    PaymentLaunchParams:
      type: object
      additionalProperties: false
      required: [timeStamp, nonceStr, package, signType, paySign]
      properties:
        timeStamp:
          type: string
          minLength: 1
        nonceStr:
          type: string
          minLength: 1
        package:
          type: string
          pattern: '^prepay_id=.+$'
        signType:
          type: string
          const: RSA
        paySign:
          type: string
          minLength: 1
    PaymentPrepayCreatedResponse:
      type: object
      additionalProperties: false
      required: [order_id, payment_id, status, launch_params]
      properties:
        order_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        status:
          type: string
          const: PREPAY_CREATED
        launch_params:
          $ref: '#/components/schemas/PaymentLaunchParams'
    PaymentConfirmingResponse:
      type: object
      additionalProperties: false
      required: [order_id, payment_id, status, order]
      properties:
        order_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        status:
          type: string
          const: PAYMENT_CONFIRMING
        order:
          $ref: '#/components/schemas/OrderDetail'
    PaymentAlreadyConfirmedResponse:
      type: object
      additionalProperties: false
      required: [order_id, status, order]
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          const: ALREADY_CONFIRMED
        order:
          $ref: '#/components/schemas/OrderDetail'
    OrderVenue:
      type: object
      additionalProperties: false
      required: [id, name, address, latitude, longitude, customer_service_phone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        customer_service_phone:
          type: string
          minLength: 1
    OrderContact:
      type: object
      additionalProperties: false
      required: [name, masked_phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        masked_phone:
          type: string
          pattern: '^1[0-9]{2}\*{4}[0-9]{4}$'
    OrderDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - order_number
        - status
        - slot_id
        - venue
        - pitch
        - starts_at
        - ends_at
        - duration_minutes
        - price_cents
        - currency
        - contact
        - created_at
        - expires_at
        - expired_at
        - cancellation_summary
        - payment_state
        - payment_confirming
        - closing_payment
        - paid_at
        - detail_path
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
          minLength: 1
        status:
          type: string
          enum: [PENDING_PAYMENT, CONFIRMED, EXPIRED, PAYMENT_EXCEPTION]
        slot_id:
          type: string
          format: uuid
        venue:
          $ref: '#/components/schemas/OrderVenue'
        pitch:
          $ref: '#/components/schemas/PhysicalPitch'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          minimum: 1
        price_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          const: CNY
        contact:
          $ref: '#/components/schemas/OrderContact'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        expired_at:
          type: [string, 'null']
          format: date-time
        cancellation_summary:
          type: string
          minLength: 1
        payment_state:
          type: [string, 'null']
          enum: [CREATING, PREPAY_CREATED, CONFIRMING, SUCCESS, CLOSED, UNKNOWN, null]
        payment_confirming:
          type: boolean
        closing_payment:
          type: boolean
        paid_at:
          type: [string, 'null']
          format: date-time
        detail_path:
          type: string
          pattern: '^/api/v1/orders/[0-9a-f-]{36}$'
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        pitch_type:
          type: string
          minLength: 1
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        current_checkout:
          $ref: '#/components/schemas/Checkout'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - PITCH_TYPE_NOT_SUPPORTED
            - DATE_OUT_OF_RANGE
            - VENUE_NOT_FOUND
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
            - PRIMARY_VENUE_MISCONFIGURED
            - AUTH_REQUIRED
            - WECHAT_LOGIN_FAILED
            - PHONE_AUTH_REQUIRED
            - PHONE_AUTH_UNAVAILABLE
            - PHONE_AUTH_FAILED
            - INVALID_CONTACT
            - SLOT_NOT_AVAILABLE
            - PRICE_CHANGED
            - IDEMPOTENCY_KEY_REUSED
            - ORDER_NOT_FOUND
            - ORDER_EXPIRED
            - PAYMENT_CREATE_FAILED
            - PAYMENT_EXCEPTION
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    PriceChangedErrorDetails:
      type: object
      additionalProperties: false
      required: [current_checkout]
      properties:
        current_checkout:
          $ref: '#/components/schemas/Checkout'
    PriceChangedError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code, details]
              properties:
                code:
                  type: string
                  enum: [PRICE_CHANGED]
                details:
                  $ref: '#/components/schemas/PriceChangedErrorDetails'
    OrderConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [SLOT_NOT_AVAILABLE, IDEMPOTENCY_KEY_REUSED]
