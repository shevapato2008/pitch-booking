        venue_name: {type: string, minLength: 1}
        pitch_name: {type: string, minLength: 1}
        pitch_specification:
          type: string
          pattern: '^[1-9][0-9]*人制$'
          description: Derived exactly as players_per_side followed by 人制.
          x-derived-from: players_per_side
          x-derived-template: '{players_per_side}人制'
        players_per_side: {type: integer, minimum: 1}
        booking_price_cents: {type: integer, minimum: 0}
