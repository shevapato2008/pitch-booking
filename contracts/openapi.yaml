  /api/v1/venue-onboarding/venues:
    post:
      operationId: submitVenueOnboardingVenue
      description: >-
        Submits an unlisted venue after server-side verified-phone snapshotting. The first submission returns 201;
        an idempotent replay returns 200; a same-key payload mismatch, duplicate, or conflicting state returns 409.
        A listed and active duplicate may return a safe claim candidate, while an unlisted match returns only a
        generic conflict without identity or location.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitVenueCreate'}
      responses:
        '200':
          description: Authoritative venue-create submission replayed.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueOnboardingApplication'}
              examples:
                VenueSubmitted: {externalValue: './examples/venue-create-submitted.json'}
        '201':
          description: Venue-create application submitted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueOnboardingApplication'}
              examples:
                VenueSubmitted: {externalValue: './examples/venue-create-submitted.json'}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '409':
          description: Possible duplicate, application state, duplicate state, or idempotency authority conflicts.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PossibleDuplicateVenueError'
                  - $ref: '#/components/schemas/VenueOnboardingSubmissionConflictError'
              examples:
                PossibleDuplicateVenue: {externalValue: './examples/error-possible-duplicate-venue.json'}
                IdempotencyKeyReused: {externalValue: './examples/error-idempotency-key-reused.json'}
        '422':
          description: Verified phone or exactly one completed item for each create evidence kind is missing or invalid.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: {enum: [INVALID_ARGUMENT, PHONE_AUTH_REQUIRED, ONBOARDING_EVIDENCE_REQUIRED, ONBOARDING_EVIDENCE_INVALID]}
              examples:
                InvalidArgument: {externalValue: './examples/error-invalid-argument.json'}
                OnboardingEvidenceRequired: {externalValue: './examples/error-onboarding-evidence-required.json'}
                PhoneAuthRequired: {externalValue: './examples/error-phone-auth-required.json'}
        '503':
          description: Service is temporarily unavailable.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
