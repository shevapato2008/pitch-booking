    PlatformAttendanceCorrectionBlockedReason:
      type: string
      enum: [GAME_NOT_COMPLETED, REGISTRATION_NOT_JOINED, ATTENDANCE_UNMARKED, ATTENDANCE_AUDIT_INCOMPLETE]
    PlatformAttendanceAllowedCorrection:
      type: object
      additionalProperties: false
      required: [target_status, blocked_reason]
      properties:
        target_status:
          type: [string, 'null']
          enum: [PRESENT, NO_SHOW, null]
        blocked_reason:
          oneOf:
            - {$ref: '#/components/schemas/PlatformAttendanceCorrectionBlockedReason'}
            - {type: 'null'}
      oneOf:
        - properties:
            target_status: {enum: [PRESENT, NO_SHOW]}
            blocked_reason: {const: null}
        - properties:
            target_status: {const: null}
            blocked_reason: {enum: [GAME_NOT_COMPLETED, REGISTRATION_NOT_JOINED, ATTENDANCE_UNMARKED, ATTENDANCE_AUDIT_INCOMPLETE]}
    PlatformAttendanceCorrectionEvent:
      type: object
      additionalProperties: false
      required: [id, registration_id, from_status, to_status, reason, corrected_by_principal_id, corrected_at, registration_version_before, registration_version_after]
      properties:
        id: {type: string, format: uuid}
        registration_id: {type: string, format: uuid}
        from_status: {type: string, enum: [PRESENT, NO_SHOW]}
        to_status: {type: string, enum: [PRESENT, NO_SHOW]}
        reason: {type: string, minLength: 1, maxLength: 1000, pattern: '.*\S.*'}
        corrected_by_principal_id: {type: string, minLength: 1, maxLength: 128}
        corrected_at: {type: string, format: date-time}
        registration_version_before: {type: integer, minimum: 1}
        registration_version_after: {type: integer, minimum: 2, description: Exactly registration_version_before + 1.}
      oneOf:
        - properties: {from_status: {const: PRESENT}, to_status: {const: NO_SHOW}}
        - properties: {from_status: {const: NO_SHOW}, to_status: {const: PRESENT}}
    PlatformAttendanceCorrectionRequest:
      type: object
      additionalProperties: false
      required: [attendance_status, expected_version, reason]
      properties:
        attendance_status: {type: string, enum: [PRESENT, NO_SHOW]}
        expected_version: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000, pattern: '.*\S.*'}
    PlatformAttendanceRegistrationDetail:
      type: object
      additionalProperties: false
      required: [registration_id, registration_status, player_display_name, intended_position, game_name, game_status, venue_name, pitch_name, starts_at, ends_at, time_zone, original_attendance_status, attendance_recorded_at, attendance_status, version, corrections, allowed_correction]
      properties:
        registration_id: {type: string, format: uuid}
        registration_status: {$ref: '#/components/schemas/OpenGameRegistrationPersistedStatus'}
        player_display_name: {type: string, minLength: 1, maxLength: 24}
        intended_position: {$ref: '#/components/schemas/OpenGameRegistrationPosition'}
        game_name: {type: string, minLength: 1, maxLength: 30}
        game_status: {$ref: '#/components/schemas/OpenGameState'}
        venue_name: {type: string, minLength: 1}
        pitch_name: {type: string, minLength: 1}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        time_zone: {type: string, const: Asia/Shanghai}
        original_attendance_status: {type: [string, 'null'], enum: [PRESENT, NO_SHOW, null]}
        attendance_recorded_at: {type: [string, 'null'], format: date-time}
        attendance_status: {$ref: '#/components/schemas/OpenGameAttendanceStatus'}
        version: {type: integer, minimum: 1}
        corrections:
          type: array
          items: {$ref: '#/components/schemas/PlatformAttendanceCorrectionEvent'}
        allowed_correction: {$ref: '#/components/schemas/PlatformAttendanceAllowedCorrection'}
      oneOf:
        - properties:
            game_status: {const: COMPLETED}
            registration_status: {const: JOINED}
            attendance_status: {const: PRESENT}
            original_attendance_status: {enum: [PRESENT, NO_SHOW]}
            attendance_recorded_at: {type: string, format: date-time}
            allowed_correction: {const: {target_status: NO_SHOW, blocked_reason: null}}
        - properties:
            game_status: {const: COMPLETED}
            registration_status: {const: JOINED}
            attendance_status: {const: NO_SHOW}
            original_attendance_status: {enum: [PRESENT, NO_SHOW]}
            attendance_recorded_at: {type: string, format: date-time}
            allowed_correction: {const: {target_status: PRESENT, blocked_reason: null}}
        - properties:
            allowed_correction:
              type: object
              properties:
                target_status: {const: null}
                blocked_reason: {$ref: '#/components/schemas/PlatformAttendanceCorrectionBlockedReason'}
          not:
            required: [game_status, registration_status, attendance_status, original_attendance_status, attendance_recorded_at]
            properties:
              game_status: {const: COMPLETED}
              registration_status: {const: JOINED}
              attendance_status: {enum: [PRESENT, NO_SHOW]}
              original_attendance_status: {enum: [PRESENT, NO_SHOW]}
              attendance_recorded_at: {type: string, format: date-time}
    PlatformOnboardingVenueSummary:
