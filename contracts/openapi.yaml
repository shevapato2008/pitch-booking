      parameters:
        - $ref: '#/components/parameters/AttendanceRegistrationId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformAttendanceCorrectionRequest'}
      responses:
        '200':
          description: Attendance correction applied or idempotently replayed.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformAttendanceCorrectionEvent'}
              examples:
                Correction: {externalValue: './examples/platform-attendance-correction-event.json'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformAttendanceMutationForbidden'}
        '404': {$ref: '#/components/responses/PlatformAttendanceNotFound'}
        '409':
          description: Attendance authority, expected version, or idempotency authority changed.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: {enum: [ATTENDANCE_STATE_CHANGED, IDEMPOTENCY_KEY_REUSED]}
        '422': {$ref: '#/components/responses/PlatformAttendanceInvalid'}
        '503': {$ref: '#/components/responses/PlatformAttendanceUnavailable'}
  /platform-admin/api/v1/auth/session:
    post:
      operationId: createPlatformSession
      security: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformSessionExchange'}
      responses:
        '200':
          description: Platform staff session created.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformSession'}
              examples:
                PlatformSession: {externalValue: './examples/platform-session.json'}
        '401': {description: Staff access token is invalid, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_AUTH_INVALID}}}}}]}}}}
        '403': {description: Same-origin validation failed, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_CSRF_INVALID}}}}}]}}}}
        '422': {description: Login input is invalid, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: INVALID_ARGUMENT}}}}}]}}}}
        '503': {description: Platform authentication is unavailable, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}}]}}}}
    get:
      operationId: getPlatformSession
      security:
        - platformSession: []
      responses:
        '200':
          description: Current platform staff session.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformSession'}
              examples:
                PlatformSession: {externalValue: './examples/platform-session.json'}
        '401': {description: Active platform staff session required, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_AUTH_REQUIRED}}}}}]}}}}
        '503': {description: Platform authentication is unavailable, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}}]}}}}
    delete:
      operationId: deletePlatformSession
      security:
        - platformSession: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '204': {description: Platform staff session revoked.}
        '401': {description: Active platform staff session required, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_AUTH_REQUIRED}}}}}]}}}}
        '403': {description: Same-origin or CSRF validation failed, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: PLATFORM_CSRF_INVALID}}}}}]}}}}
        '503': {description: Platform authentication is unavailable, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: object, properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}}]}}}}
  /platform-admin/api/v1/onboarding/applications:
    get:
      operationId: listPlatformOnboardingApplications
      description: Newest-first platform review queue. Private evidence storage fields and phone ciphertext are never returned.
      security:
        - platformSession: []
      parameters:
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [CLAIM, CREATE]}
        - name: status
          in: query
          required: false
          schema: {type: string, enum: [SUBMITTED, APPROVED, REJECTED]}
        - name: cursor
          in: query
          required: false
          schema: {type: [string, 'null']}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Filtered review queue.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformOnboardingQueue'}
              examples:
                Queue: {externalValue: './examples/platform-onboarding-queue.json'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformReviewForbidden'}
        '422': {$ref: '#/components/responses/PlatformOnboardingInvalid'}
        '503': {$ref: '#/components/responses/PlatformOnboardingUnavailable'}
  /platform-admin/api/v1/onboarding/applications/{application_id}:
    get:
      operationId: getPlatformOnboardingApplication
      security:
        - platformSession: []
      parameters:
        - $ref: '#/components/parameters/OnboardingApplicationId'
      responses:
        '200':
          description: Reviewer detail with masked phone and closed evidence metadata.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformOnboardingApplicationDetail'}
              examples:
                Detail: {externalValue: './examples/platform-onboarding-detail.json'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformReviewForbidden'}
        '404': {$ref: '#/components/responses/PlatformOnboardingNotFound'}
        '422': {$ref: '#/components/responses/PlatformOnboardingInvalid'}
        '503': {$ref: '#/components/responses/PlatformOnboardingUnavailable'}
  /platform-admin/api/v1/onboarding/evidence/{evidence_id}/download:
    get:
      operationId: createPlatformOnboardingEvidenceDownload
      description: Issues a short-lived attachment-oriented GET URL for completed evidence attached to an onboarding application.
      security:
        - platformSession: []
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Short-lived private evidence download.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformOnboardingEvidenceDownload'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformReviewForbidden'}
        '404': {$ref: '#/components/responses/PlatformOnboardingNotFound'}
        '422': {$ref: '#/components/responses/PlatformOnboardingInvalid'}
        '503': {$ref: '#/components/responses/PlatformOnboardingUnavailable'}
  /platform-admin/api/v1/onboarding/applications/{application_id}/decisions:
    post:
      operationId: decidePlatformOnboardingApplication
      description: >-
        Atomically approves or rejects one application. An equivalent outcome and trimmed reason replays the existing
        decision; any different decision against a decided application returns a state conflict.
      security:
        - platformSession: []
      parameters:
        - $ref: '#/components/parameters/OnboardingApplicationId'
        - name: Origin
          in: header
          required: true
          schema: {type: string, format: uri}
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformOnboardingDecisionRequest'}
      responses:
        '200':
          description: Decision applied or equivalently replayed.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformOnboardingDecision'}
              examples:
                Decision: {externalValue: './examples/platform-onboarding-decision.json'}
        '401': {$ref: '#/components/responses/PlatformAuthRequired'}
        '403': {$ref: '#/components/responses/PlatformReviewForbidden'}
        '404': {$ref: '#/components/responses/PlatformOnboardingNotFound'}
        '409':
          description: Application already has a different immutable decision or a duplicate venue blocks approval.
          headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: {enum: [ONBOARDING_APPLICATION_STATE_CHANGED, POSSIBLE_DUPLICATE_VENUE]}
        '422': {$ref: '#/components/responses/PlatformOnboardingInvalid'}
        '503': {$ref: '#/components/responses/PlatformOnboardingUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    platformSession:
      type: apiKey
      in: cookie
      name: pitch_platform_session
  headers:
    RequestId:
      description: Identifier used to trace the request.
      required: true
      schema:
        type: string
        minLength: 1
  parameters:
    VenueId:
      name: venue_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ImageId:
      name: image_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ModerationItemId:
      name: item_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Reuse the same key to recover the authoritative result after an unknown outcome.
      schema: {type: string, minLength: 16, maxLength: 128}
    AttendanceRegistrationId:
      name: registration_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    OnboardingApplicationId:
      name: application_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    PlatformAuthRequired:
      description: Active platform staff session required.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: PLATFORM_AUTH_REQUIRED}}}}
    PlatformAttendanceForbidden:
      description: PLATFORM_ADMIN role required.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: PLATFORM_ROLE_REQUIRED}}}}
    PlatformAttendanceMutationForbidden:
      description: PLATFORM_ADMIN role and valid same-origin mutation protection required.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {enum: [PLATFORM_ROLE_REQUIRED, PLATFORM_CSRF_INVALID]}}}}
    PlatformAttendanceNotFound:
      description: Registration does not exist.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: ATTENDANCE_REGISTRATION_NOT_FOUND}}}}
    PlatformAttendanceInvalid:
      description: Registration identifier, headers, target attendance status, expected version, or reason is invalid.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: INVALID_ARGUMENT}}}}
    PlatformAttendanceUnavailable:
      description: Platform attendance correction service is unavailable.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}
    PlatformReviewForbidden:
      description: Platform onboarding reviewer role or valid mutation protection required.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {enum: [PLATFORM_ROLE_REQUIRED, PLATFORM_CSRF_INVALID]}}}}
    PlatformOnboardingNotFound:
      description: Application or attached evidence not found.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: ONBOARDING_APPLICATION_NOT_FOUND}}}}
    PlatformOnboardingInvalid:
      description: Filter, cursor, path, or decision input is invalid.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: INVALID_ARGUMENT}}}}
    PlatformOnboardingUnavailable:
      description: Platform onboarding review service is unavailable.
      headers: {X-Request-Id: {$ref: '#/components/headers/RequestId'}}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties: {error: {type: object, properties: {code: {const: SERVICE_UNAVAILABLE}}}}
    AuthRequired:
      description: Authentication required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    VenueProfileForbidden:
      description: Venue profile management permission required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ManualModerationForbidden:
      description: Configured platform moderation reviewer permission required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    VenueProfileNotFound:
      description: Venue, image, revision, or moderation item not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    VenueProfileSnapshot:
      description: Published authority and the current private draft with fixed catalogs.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminVenueProfile'}
          examples:
            Ready: {externalValue: './examples/venue-profile-admin-ready.json'}
            Reviewing: {externalValue: './examples/venue-profile-reviewing.json'}
            Rejected: {externalValue: './examples/venue-profile-rejected.json'}
    VenueProfileMutationApplied:
      description: Mutation applied or replayed with the authoritative profile snapshot.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminVenueProfile'}
          examples:
            Ready: {externalValue: './examples/venue-profile-admin-ready.json'}
    VenueProfileUploadIntentCreated:
      description: Private direct-upload reservation created; the URL is short-lived and contains no credentials.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VenueProfileUploadIntent'}
          examples:
            UploadIntent: {externalValue: './examples/venue-profile-upload-intent.json'}
    VenueProfileReviewStarted:
      description: Upload completion or moderation retry accepted with the current reviewing snapshot.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminVenueProfile'}
          examples:
            Reviewing: {externalValue: './examples/venue-profile-reviewing.json'}
    ManualVenueProfileReviewQueue:
      description: Current PENDING_MANUAL items visible only to configured reviewers.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManualReviewQueue'}
          examples:
            Pending: {externalValue: './examples/manual-review-queue.json'}
    ManualModerationDecisionApplied:
      description: Decision applied or idempotently replayed; no response body.
    VenueProfileVersionConflict:
      description: Facility, revision, item, or idempotency authority changed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            VenueProfileVersionConflict: {externalValue: './examples/error-venue-profile-version-conflict.json'}
    VenueProfileValidationFailed:
      description: Description, facility, image, MIME type, size, order, cover, or decision is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            VenueProfileValidationFailed: {externalValue: './examples/error-venue-profile-validation.json'}
  schemas:
    PublicGameFormat:
      type: string
      enum: [FIVE, SEVEN]
    PublicGameDirectoryItem:
      type: object
      additionalProperties: false
      required: [detail_path, local_date, format, current_players, remaining_spots, game]
      properties:
        detail_path:
          type: string
          pattern: '^/pages/captain-game-public/index\?token=[A-Za-z0-9_-]{32}$'
        local_date: {type: string, format: date}
        format: {$ref: '#/components/schemas/PublicGameFormat'}
        current_players: {type: integer, minimum: 1}
        remaining_spots: {type: integer, minimum: 0}
        game: {$ref: '#/components/schemas/OpenGamePublic'}
    PublicGameDirectoryResponse:
      type: object
      additionalProperties: false
      required: [authoritative_now, available_dates, items]
      properties:
        authoritative_now: {type: string, format: date-time}
        available_dates:
          type: array
          uniqueItems: true
          items: {type: string, format: date}
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicGameDirectoryItem'}
    OpenGamePersistedStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED]
    OpenGameState:
      type: string
      enum: [DRAFT, PUBLISHED, SUSPENDED, CANCELLED, COMPLETED]
    OpenGameStateReason:
      type: [string, 'null']
      enum:
        - REGISTRATION_WINDOW_CLOSED
        - REGISTRATION_DEADLINE_PASSED
        - CAPTAIN_CANCELLED
        - ORDER_CANCELLATION_PENDING
        - ORDER_PAYMENT_EXCEPTION
        - ORDER_REFUND_PENDING
        - ORDER_REFUND_FAILED
        - ORDER_CANCELLED
        - ORDER_REFUNDED
        - ORDER_COMPLETED
        - null
    OpenGamePublicStateReason:
      type: [string, 'null']
      enum: [REGISTRATION_WINDOW_CLOSED, REGISTRATION_DEADLINE_PASSED, CAPTAIN_CANCELLED, BOOKING_UNAVAILABLE, BOOKING_COMPLETED, null]
    OpenGameVisibility:
      type: string
      enum: [PUBLIC, LINK_ONLY]
    OpenGameIntensity:
      type: string
      enum: [BEGINNER_FRIENDLY, CASUAL, COMPETITIVE]
    OpenGamePositions:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD, ANY]
      enum:
        - [ANY]
        - [GOALKEEPER]
        - [DEFENDER]
        - [MIDFIELDER]
        - [FORWARD]
        - [GOALKEEPER, DEFENDER]
        - [GOALKEEPER, MIDFIELDER]
        - [GOALKEEPER, FORWARD]
        - [DEFENDER, MIDFIELDER]
        - [DEFENDER, FORWARD]
        - [MIDFIELDER, FORWARD]
        - [GOALKEEPER, DEFENDER, MIDFIELDER]
        - [GOALKEEPER, DEFENDER, FORWARD]
        - [GOALKEEPER, MIDFIELDER, FORWARD]
        - [DEFENDER, MIDFIELDER, FORWARD]
        - [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD]
      x-canonical-order: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD]
    OpenGamePositionSelection:
      type: array
      oneOf:
        - const: [ANY]
        - minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD]
    OpenGameRegistrationPosition:
      type: string
      enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD, ANY]
    OpenGameAttendanceStatus:
      type: string
      enum: [UNMARKED, PRESENT, NO_SHOW]
    OpenGameRegistrationPersistedStatus:
      type: string
      enum: [APPLIED, WAITLISTED, JOINED, REJECTED, WITHDRAWN]
    OpenGameRegistrationEffectiveStatus:
      type: string
      enum: [APPLIED, WAITLISTED, JOINED, REJECTED, WITHDRAWN, CANCELLED]
    OpenGameRegistrationWithdrawalKind:
      type: string
      enum: [APPLICATION_WITHDRAWAL, WAITLIST_WITHDRAWAL, GAME_EXIT]
    OpenGameRegistrationAvailableWithdrawalAction:
      type: string
      enum: [WITHDRAW_APPLICATION, WITHDRAW_WAITLIST, LEAVE_GAME]
    OpenGameRegistrationWithdrawalAction:
      type: string
      enum: [WITHDRAW_APPLICATION, WITHDRAW_WAITLIST, LEAVE_GAME]
    MyOpenGameApplication:
      type: object
      additionalProperties: false
      required: [id, effective_status, applied_at, waitlist_position, waitlisted_at, promoted_at, attendance_status, attendance_recorded_at, detail_path, game_name, starts_at, ends_at, time_zone, venue_name, pitch_name, pitch_specification]
      properties:
        id: {type: string, format: uuid}
        effective_status: {$ref: '#/components/schemas/OpenGameRegistrationEffectiveStatus'}
        applied_at: {type: string, format: date-time}
        waitlist_position: {type: [integer, 'null'], minimum: 1}
        waitlisted_at: {type: [string, 'null'], format: date-time}
        promoted_at: {type: [string, 'null'], format: date-time}
        attendance_status:
          oneOf:
            - $ref: '#/components/schemas/OpenGameAttendanceStatus'
            - type: 'null'
        attendance_recorded_at: {type: [string, 'null'], format: date-time}
        detail_path:
          type: string
          pattern: '^/pages/captain-game-public/index\?token=[A-Za-z0-9_-]{32}$'
        game_name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        time_zone: {type: string}
        venue_name: {type: string}
        pitch_name: {type: string}
        pitch_specification: {type: string}
      oneOf:
        - properties:
            attendance_status: {const: null}
            attendance_recorded_at: {const: null}
        - properties:
            attendance_status: {const: UNMARKED}
            attendance_recorded_at: {const: null}
        - properties:
            attendance_status: {enum: [PRESENT, NO_SHOW]}
            attendance_recorded_at: {type: string, format: date-time}
    MyOpenGameApplicationsResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MyOpenGameApplication'}
        next_cursor: {type: [string, 'null'], minLength: 1}
    OpenGameAttendanceGameSummary:
      type: object
      additionalProperties: false
      required: [id, name, venue_name, pitch_name, starts_at, ends_at, time_zone, state]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 30}
        venue_name: {type: string, minLength: 1}
        pitch_name: {type: string, minLength: 1}
