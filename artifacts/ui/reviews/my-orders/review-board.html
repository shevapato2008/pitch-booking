<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的订单 · 参考稿视觉板</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; color: #10243e; background: #eef3f7; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header, main { max-width: 1700px; margin: 0 auto; }
      h1 { margin: 0 0 8px; font-size: 30px; }
      p { margin: 0 0 24px; color: #526479; }
      .pill { display: inline-flex; align-items: center; min-height: 28px; margin-right: 8px; padding: 3px 10px; border: 1px solid #bae6fd; border-radius: 999px; background: #f0f9ff; color: #075985; font-weight: 700; }
      .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(375px, 1fr)); gap: 24px; align-items: start; }
      figure { width: 375px; margin: 0 auto; overflow: hidden; border: 1px solid #dbe5ec; border-radius: 16px; background: #fff; box-shadow: 0 8px 22px rgb(16 36 62 / 8%); }
      img { display: block; width: 375px; height: 812px; background: #f8fafc; }
      figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 12px 16px; font-weight: 700; }
      a { color: #0369a1; }
      @media (max-width: 640px) { body { padding: 20px 0; } header { padding: 0 14px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>我的订单 · 参考稿视觉板</h1>
      <p><span class="pill">375 × 812</span><span class="pill">Reference only</span><span class="pill">等待视觉确认</span></p>
    </header>
    <main class="board">
      <figure data-state="map-entry"><a href="map-entry-reference-375x812.png"><img src="map-entry-reference-375x812.png" width="375" height="812" alt="场馆地图我的订单入口参考稿" /></a><figcaption><span>map-entry</span><a href="../../references/my-orders.html?state=map-entry">打开交互稿</a></figcaption></figure>
      <figure data-state="ready"><a href="ready-reference-375x812.png"><img src="ready-reference-375x812.png" width="375" height="812" alt="我的订单列表参考稿" /></a><figcaption><span>ready</span><a href="../../references/my-orders.html?state=ready">打开交互稿</a></figcaption></figure>
      <figure data-state="empty"><a href="empty-reference-375x812.png"><img src="empty-reference-375x812.png" width="375" height="812" alt="我的订单空状态参考稿" /></a><figcaption><span>empty</span><a href="../../references/my-orders.html?state=empty">打开交互稿</a></figcaption></figure>
      <figure data-state="error"><a href="error-reference-375x812.png"><img src="error-reference-375x812.png" width="375" height="812" alt="我的订单加载错误参考稿" /></a><figcaption><span>error</span><a href="../../references/my-orders.html?state=error">打开交互稿</a></figcaption></figure>
    </main>
  </body>
</html>
