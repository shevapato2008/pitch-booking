<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>确认订单 · 视觉验收</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #10243e; background: #edf3f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1180px, calc(100% - 32px)); margin: 32px auto 64px; }
    header, section { padding: 24px; border: 1px solid #dbe5ec; border-radius: 20px; background: #fff; box-shadow: 0 16px 40px rgba(16,36,62,.06); }
    header { margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    p { margin: 8px 0 0; color: #52667e; line-height: 1.6; }
    .badge { display: inline-block; margin-top: 12px; padding: 6px 10px; border-radius: 999px; color: #075985; background: #e0f2fe; font-size: 13px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    section { min-width: 0; }
    section.wide { grid-column: 1 / -1; }
    figure { margin: 0; overflow: auto; text-align: center; }
    img { max-width: 100%; height: auto; border: 1px solid #dbe5ec; background: #f7fafc; }
    .phone { width: 375px; }
    .comparison { width: 750px; }
    figcaption { margin-top: 12px; color: #64748b; font-size: 13px; line-height: 1.5; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } section.wide { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>确认订单 · 375 × 812 视觉验收</h1>
      <p>参考稿与微信开发者工具真实运行时已统一到同一目标尺寸。请重点核对构图、间距、层级、字体色彩、文案及状态语义。</p>
      <span class="badge">等待用户明确确认</span>
    </header>
    <div class="grid">
      <section>
        <h2>1. 冻结参考稿</h2>
        <figure><img class="phone" src="reference-375x812.png" alt="冻结参考稿"><figcaption>Chrome 参考稿，375 × 812。</figcaption></figure>
      </section>
      <section>
        <h2>2. 微信真实实现</h2>
        <figure><img class="phone" src="implementation-375x812.png" alt="微信小程序真实实现"><figcaption>微信开发者工具 Stable 2.01.2510290，iPhone X，未授权基线。</figcaption></figure>
      </section>
      <section class="wide">
        <h2>3. 并排对比</h2>
        <figure><img class="comparison" src="side-by-side.png" alt="参考稿与实现并排对比"><figcaption>左：参考稿；右：真实小程序。</figcaption></figure>
      </section>
      <section>
        <h2>4. 50% 叠加</h2>
        <figure><img class="phone" src="overlay-50.png" alt="百分之五十叠加图"><figcaption>用于核对边界、卡片位置和固定提交栏。</figcaption></figure>
      </section>
      <section>
        <h2>5. 像素差异</h2>
        <figure><img class="phone" src="difference.png" alt="像素差异图"><figcaption>包含原生导航、动态时间、字体渲染与采样差异。</figcaption></figure>
      </section>
    </div>
  </main>
</body>
</html>
