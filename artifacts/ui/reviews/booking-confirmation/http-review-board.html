<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>确认订单 · HTTP 视觉验收</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #10243e; background: #edf3f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1180px, calc(100% - 32px)); margin: 32px auto 64px; }
    header, section { padding: 24px; border: 1px solid #dbe5ec; border-radius: 20px; background: #fff; box-shadow: 0 16px 40px rgba(16,36,62,.06); }
    header { margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    p { margin: 8px 0 0; color: #52667e; line-height: 1.6; }
    .badge { display: inline-block; margin-top: 12px; padding: 6px 10px; border-radius: 999px; color: #075985; background: #e0f2fe; font-size: 13px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    section { min-width: 0; }
    section.wide { grid-column: 1 / -1; }
    figure { margin: 0; overflow: auto; text-align: center; }
    img { max-width: 100%; height: auto; border: 1px solid #dbe5ec; background: #f7fafc; }
    .phone { width: 375px; }
    .comparison { width: 750px; }
    figcaption { margin-top: 12px; color: #64748b; font-size: 13px; line-height: 1.5; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } section.wide { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>确认订单 · Development-HTTP 视觉验收</h1>
      <p>左侧基线是已批准的 Fixture 小程序实现，右侧是连接本地真实 API、数据库和开发登录后的同状态页面；两者均为 375 × 812。</p>
      <span class="badge">用户已确认 · 2026-07-28</span>
    </header>
    <div class="grid">
      <section>
        <h2>1. 已批准 Fixture 基线</h2>
        <figure><img class="phone" src="implementation-375x812.png" alt="已批准 Fixture 基线"><figcaption>微信开发者工具，未授权手机号状态，375 × 812。</figcaption></figure>
      </section>
      <section>
        <h2>2. 真实 HTTP 实现</h2>
        <figure><img class="phone" src="http-implementation-375x812.png" alt="真实 HTTP 实现"><figcaption>真实 seed 场次：7 月 29 日 19:00–21:00，¥320。</figcaption></figure>
      </section>
      <section class="wide">
        <h2>3. 并排对比</h2>
        <figure><img class="comparison" src="http-side-by-side.png" alt="Fixture 与 HTTP 实现并排对比"><figcaption>左：已批准 Fixture；右：Development-HTTP。</figcaption></figure>
      </section>
      <section>
        <h2>4. 50% 叠加</h2>
        <figure><img class="phone" src="http-overlay-50.png" alt="HTTP 百分之五十叠加图"><figcaption>用于核对卡片、留白、固定提交栏和组件边界。</figcaption></figure>
      </section>
      <section>
        <h2>5. 像素差异</h2>
        <figure><img class="phone" src="http-difference.png" alt="HTTP 像素差异图"><figcaption>主要预期差异来自真实场馆文案、日期和系统时间。</figcaption></figure>
      </section>
    </div>
  </main>
</body>
</html>
