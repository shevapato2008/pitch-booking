<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C2d 平台到场纠错视觉板</title>
    <style>
      body { margin: 0; padding: 24px; background: #f8fafc; color: #10243e; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      h1 { margin: 0 0 8px; } p { color: #526479; } section { margin-top: 28px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      figure { margin: 0; padding: 12px; border: 1px solid #dbe5ec; border-radius: 12px; background: white; }
      img { display: block; width: 100%; height: auto; border: 1px solid #e2e8f0; }
      figcaption { margin-top: 8px; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>C2d 平台到场纠错</h1>
    <p>1440 × 900 · development-only Fixture · DELEGATED_VISUAL_PASS</p>
    <section><h2>Ready</h2><div class="grid">
      <figure><img src="ready-reference-1440x900.png" alt="Ready 参考图" /><figcaption>Reference</figcaption></figure>
      <figure><img src="ready-implementation-1440x900.png" alt="Ready 实现图" /><figcaption>Implementation</figcaption></figure>
      <figure><img src="ready-1440x900-side-by-side.png" alt="Ready 并排图" /><figcaption>Side-by-side</figcaption></figure>
      <figure><img src="ready-1440x900-overlay-50.png" alt="Ready 百分之五十叠加图" /><figcaption>Overlay 50%</figcaption></figure>
      <figure><img src="ready-1440x900-difference.png" alt="Ready 差异图" /><figcaption>Difference</figcaption></figure>
    </div></section>
    <section><h2>Confirm</h2><div class="grid">
      <figure><img src="confirm-reference-1440x900.png" alt="Confirm 参考图" /><figcaption>Reference</figcaption></figure>
      <figure><img src="confirm-implementation-1440x900.png" alt="Confirm 实现图" /><figcaption>Implementation</figcaption></figure>
      <figure><img src="confirm-1440x900-side-by-side.png" alt="Confirm 并排图" /><figcaption>Side-by-side</figcaption></figure>
      <figure><img src="confirm-1440x900-overlay-50.png" alt="Confirm 百分之五十叠加图" /><figcaption>Overlay 50%</figcaption></figure>
      <figure><img src="confirm-1440x900-difference.png" alt="Confirm 差异图" /><figcaption>Difference</figcaption></figure>
    </div></section>
  </body>
</html>
