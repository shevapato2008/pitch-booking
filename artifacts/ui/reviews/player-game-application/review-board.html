<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>散客申请与队长审核 · 参考稿视觉板</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; color: #10243E; background: #EEF3F7; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header, main { max-width: 1700px; margin: auto; }
      h1 { margin: 0 0 8px; font-size: 30px; }
      p { margin: 0 0 24px; color: #526479; }
      .pill { display: inline-flex; min-height: 28px; align-items: center; margin-right: 8px; padding: 3px 10px; border: 1px solid #BAE6FD; border-radius: 999px; background: #F0F9FF; color: #0369A1; font-weight: 700; }
      .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(375px, 1fr)); gap: 24px; }
      figure { width: 375px; margin: 0 auto; overflow: hidden; border: 1px solid #DBE5EC; border-radius: 16px; background: #FFFFFF; box-shadow: 0 8px 22px rgb(16 36 62 / 8%); }
      img { display: block; width: 375px; height: 812px; background: #F8FAFC; }
      figcaption { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 12px 16px; font-weight: 700; }
      a { color: #0369A1; }
      @media (max-width: 640px) { body { padding: 20px 0; } header { padding: 0 14px; } }
    </style>
  </head>
  <body>
    <header><h1>散客申请与队长审核 · 参考稿视觉板</h1><p><span class="pill">375 × 812</span><span class="pill">Reference only</span><span class="pill">等待用户视觉确认</span></p></header>
    <main class="board">
      <figure data-state="anonymous-detail"><a href="anonymous-detail-reference-375x812.png"><img src="anonymous-detail-reference-375x812.png" width="375" height="812" alt="未登录球局详情参考稿" /></a><figcaption><span>anonymous-detail</span><a href="../../references/player-game-application.html?state=anonymous-detail">打开交互稿</a></figcaption></figure>
      <figure data-state="application-ready"><a href="application-ready-reference-375x812.png"><img src="application-ready-reference-375x812.png" width="375" height="812" alt="申请表参考稿" /></a><figcaption><span>application-ready</span><a href="../../references/player-game-application.html?state=application-ready">打开交互稿</a></figcaption></figure>
      <figure data-state="applied-detail"><a href="applied-detail-reference-375x812.png"><img src="applied-detail-reference-375x812.png" width="375" height="812" alt="等待审核详情参考稿" /></a><figcaption><span>applied-detail</span><a href="../../references/player-game-application.html?state=applied-detail">打开交互稿</a></figcaption></figure>
      <figure data-state="captain-pending"><a href="captain-pending-reference-375x812.png"><img src="captain-pending-reference-375x812.png" width="375" height="812" alt="队长待审核参考稿" /></a><figcaption><span>captain-pending</span><a href="../../references/player-game-application.html?state=captain-pending">打开交互稿</a></figcaption></figure>
      <figure data-state="joined-detail"><a href="joined-detail-reference-375x812.png"><img src="joined-detail-reference-375x812.png" width="375" height="812" alt="申请已接受详情参考稿" /></a><figcaption><span>joined-detail</span><a href="../../references/player-game-application.html?state=joined-detail">打开交互稿</a></figcaption></figure>
      <figure data-state="rejected-detail"><a href="rejected-detail-reference-375x812.png"><img src="rejected-detail-reference-375x812.png" width="375" height="812" alt="申请已婉拒详情参考稿" /></a><figcaption><span>rejected-detail</span><a href="../../references/player-game-application.html?state=rejected-detail">打开交互稿</a></figcaption></figure>
    </main>
  </body>
</html>
