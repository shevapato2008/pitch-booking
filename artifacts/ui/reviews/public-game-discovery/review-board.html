<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公开球局发现 · 参考稿视觉板</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; color: #10243E; background: #EEF3F7; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header, main { max-width: 1700px; margin: auto; }
      h1 { margin: 0 0 8px; font-size: 30px; }
      p { margin: 0 0 24px; color: #526479; }
      .pill { display: inline-flex; min-height: 28px; align-items: center; margin-right: 8px; padding: 3px 10px; border: 1px solid #BAE6FD; border-radius: 999px; background: #F0F9FF; color: #0369A1; font-weight: 700; }
      .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(375px, 1fr)); gap: 24px; }
      figure { width: 375px; margin: 0 auto; overflow: hidden; border: 1px solid #DBE5EC; border-radius: 16px; background: #FFF; box-shadow: 0 8px 22px rgb(16 36 62 / 8%); }
      img { display: block; width: 375px; height: 812px; background: #F8FAFC; }
      figcaption { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 12px 16px; font-weight: 700; }
      a { color: #0369A1; }
      @media (max-width: 640px) { body { padding: 20px 0; } header { padding: 0 14px; } }
    </style>
  </head>
  <body>
    <header><h1>公开球局发现 · 参考稿视觉板</h1><p><span class="pill">375 × 812</span><span class="pill">Reference only</span><span class="pill">等待用户确认</span></p></header>
    <main class="board">
      <figure data-state="ready-list"><a href="ready-list-reference-375x812.png"><img src="ready-list-reference-375x812.png" width="375" height="812" alt="公开球局默认列表参考稿" /></a><figcaption><span>ready-list</span><a href="../../references/public-game-discovery.html?state=ready-list">打开交互稿</a></figcaption></figure>
      <figure data-state="filtered-nonempty"><a href="filtered-nonempty-reference-375x812.png"><img src="filtered-nonempty-reference-375x812.png" width="375" height="812" alt="筛选后有结果参考稿" /></a><figcaption><span>filtered-nonempty</span><a href="../../references/public-game-discovery.html?state=filtered-nonempty">打开交互稿</a></figcaption></figure>
      <figure data-state="filter-no-match"><a href="filter-no-match-reference-375x812.png"><img src="filter-no-match-reference-375x812.png" width="375" height="812" alt="筛选无结果参考稿" /></a><figcaption><span>filter-no-match</span><a href="../../references/public-game-discovery.html?state=filter-no-match">打开交互稿</a></figcaption></figure>
      <figure data-state="load-error"><a href="load-error-reference-375x812.png"><img src="load-error-reference-375x812.png" width="375" height="812" alt="加载错误参考稿" /></a><figcaption><span>load-error</span><a href="../../references/public-game-discovery.html?state=load-error">打开交互稿</a></figcaption></figure>
    </main>
  </body>
</html>
