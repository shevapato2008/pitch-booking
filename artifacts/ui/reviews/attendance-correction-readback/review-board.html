<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C2d 回读 Artifact 视觉板</title>
    <style>
      body { margin: 0; padding: 24px; background: #f8fafc; color: #10243e; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      h1 { margin: 0 0 8px; } p { color: #526479; } .warning { color: #b42318; font-weight: 700; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
      figure { margin: 0; padding: 12px; border: 1px solid #dbe5ec; border-radius: 12px; background: white; }
      img { display: block; width: 100%; height: auto; border: 1px solid #e2e8f0; }
      figcaption { margin-top: 8px; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>C2d 队长/球员回读</h1>
    <p class="warning">WECHAT_NATIVE_PENDING — 以下仅为浏览器 Artifact，不是微信原生证据。</p>
    <div class="grid">
      <figure><img src="captain-artifact-ios-390x844.png" alt="队长 iOS 尺寸浏览器 Artifact" /><figcaption>Captain · iOS size</figcaption></figure>
      <figure><img src="captain-artifact-android-411x731.png" alt="队长 Android 尺寸浏览器 Artifact" /><figcaption>Captain · Android size</figcaption></figure>
      <figure><img src="player-artifact-ios-390x844.png" alt="球员 iOS 尺寸浏览器 Artifact" /><figcaption>Player · iOS size</figcaption></figure>
      <figure><img src="player-artifact-android-411x731.png" alt="球员 Android 尺寸浏览器 Artifact" /><figcaption>Player · Android size</figcaption></figure>
    </div>
  </body>
</html>
