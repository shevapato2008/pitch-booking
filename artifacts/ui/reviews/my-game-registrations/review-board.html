<!doctype html>

    <style>
      * { box-sizing: border-box; }

      h1 { margin: 0 0 8px; font-size: 30px; }

      img { display: block; width: 375px; height: 812px; background: #F8FAFC; }
      figcaption { display: flex; min-height: 52px; align-items: center; justify-content: space-between; padding: 12px 16px; font-weight: 700; }
      a { color: #0369A1; }
      @media (max-width: 640px) { body { padding: 20px 0; } header { padding: 0 14px; } }

    <main>
