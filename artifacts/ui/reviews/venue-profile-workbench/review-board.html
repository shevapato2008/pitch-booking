<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>场馆资料工作台 · Native review board</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #10243e; background: #e8eef5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { position: sticky; z-index: 5; top: 0; padding: 18px 24px; border-bottom: 1px solid #cbd5e1; background: rgba(248,250,252,.96); backdrop-filter: blur(12px); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    header p { max-width: 1100px; margin: 0; color: #475569; line-height: 1.55; }
    .pill { display: inline-block; margin-right: 8px; padding: 4px 10px; border-radius: 999px; background: #fef3c7; color: #92400e; font-size: 12px; font-weight: 700; }
    main { display: grid; gap: 20px; max-width: 1600px; margin: 0 auto; padding: 24px; }
    section { padding: 18px; border: 1px solid #cbd5e1; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px rgba(16,36,62,.07); }
    h2 { margin: 0 0 6px; font-size: 18px; }
    .note { margin: 0 0 16px; color: #64748b; font-size: 13px; }
    .phones { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: 14px; align-items: start; overflow-x: auto; }
    figure { min-width: 180px; margin: 0; }
    img { display: block; width: 100%; height: auto; border: 1px solid #dbe3ec; border-radius: 12px; background: #f8fafc; }
    .single img { aspect-ratio: 375 / 812; object-fit: contain; }
    .wide img { aspect-ratio: 750 / 812; object-fit: contain; }
    figcaption { margin-top: 7px; color: #475569; font-size: 12px; }
    @media (max-width: 1000px) { .phones { grid-template-columns: repeat(5, 240px); } }
  </style>
</head>
<body>
  <header>
    <h1>场馆资料工作台 · Same-size Native review</h1>
    <p><span class="pill">User visual approval approved · 2026-08-11 · all 10 states</span>375 × 812 · WeChat DevTools Stable 2.01.2510290 · base library 3.17.0 · iPhone X. 每组为 Reference、真实微信实现、并排、50% 叠加、像素差异；实现保留系统状态栏、胶囊、安全区和 Home Indicator。</p>
  </header>
  <main id="board"></main>
  <script>
    const states = [
      ["ready", "资料可编辑；图片操作、介绍、设施与保存入口"],
      ["uploading", "图片上传中；保存禁用"],
      ["image-reviewing", "图片审核中；公开页继续显示上一版"],
      ["image-rejected", "图片拒绝；审核原因首屏可见（回归修复后重采）"],
      ["description-reviewing", "整版资料审核中"],
      ["description-rejected", "介绍拒绝；审核原因首屏可见（回归修复后重采）"],
      ["pending-manual", "不确定结果转人工"],
      ["load-error", "编辑数据加载失败，公开资料不受影响"],
      ["save-unknown", "核对同一次保存结果，禁止重复保存"],
      ["public-published", "只展示最近一次整版通过的数据；无联系方式"],
    ];
    const slots = [
      ["reference", "Reference", "single"],
      ["implementation", "Native implementation", "single"],
      ["side-by-side", "Side by side", "wide"],
      ["overlay-50", "Overlay 50%", "single"],
      ["difference", "Difference", "single"],
    ];
    const board = document.querySelector("#board");
    states.forEach(([state, note]) => {
      const section = document.createElement("section");
      section.innerHTML = `<h2>${state}</h2><p class="note">${note}</p><div class="phones"></div>`;
      const phones = section.querySelector(".phones");
      slots.forEach(([slot, label, shape]) => {
        const figure = document.createElement("figure");
        figure.className = shape;
        figure.innerHTML = `<img src="${state}-${slot}.png" alt="${state} ${label}"><figcaption>${label}</figcaption>`;
        phones.append(figure);
      });
      board.append(section);
    });
  </script>
</body>
</html>
