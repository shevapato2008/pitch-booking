<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>位置权限被拒绝</title><style>
:root{--brand:#0284c7;--text:#10243e;--muted:#64748b;--border:#dbe5ec;--target-min:44px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;background:#dce7e7}.artifact { width:375px; height:812px;position:relative;overflow:hidden;margin:auto;color:var(--text);background:#dce8e3}.map{position:absolute;inset:0;background:linear-gradient(26deg,transparent 44%,#fff 45% 48%,transparent 49%),#dce8e3}.locate{position:absolute;z-index:2;right:12px;top:calc(12px + env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:#fff;font-size:20px}.sheet{position:absolute;left:0;right:0;bottom:0;height:376px;background:#fff;border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px #10243e22}.handle{width:40px;height:4px;background:#cbd5e1;border-radius:4px;margin:auto}.icon{width:52px;height:52px;margin:26px 0 14px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center}.icon svg{width:26px;fill:none;stroke:#475569;stroke-width:2}.sheet h1{font-size:22px;margin:0 0 8px}.sheet p{color:var(--muted);line-height:1.6}.primary,.secondary{width:100%;min-height:var(--target-min);border-radius:14px;font:inherit;font-weight:700}.primary{border:0;background:var(--brand);color:#fff}.secondary{margin-top:8px;border:1px solid var(--border);background:#fff;color:var(--text)}
