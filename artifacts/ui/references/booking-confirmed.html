<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>订单详情 · 预订成功</title>
  <style>
    :root {
      --background: #f8fafc;
      --surface: #ffffff;
      --text: #10243e;
      --muted: #64748b;
      --border: #dbe5ec;
      --action-blue: #0369a1;
      --success: #059669;
    }
    * { box-sizing: border-box; }
    html,
    body {
      width: 375px;
      height: 812px;
      margin: 0;
    }
    body { background: var(--background); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .artifact { position: relative; width: 375px; height: 812px; overflow: hidden; background: var(--background); }
    .status { height: 28px; padding-top: 8px; background: var(--surface); font-size: 11px; text-align: center; }
    .nav { height: 50px; margin: 0; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 16px; font-weight: 700; }
    .screen { height: calc(100% - 78px); padding: 16px 16px 100px; overflow-x: hidden; overflow-y: auto; }
    .hero { display: flex; flex-direction: column; align-items: center; padding: 8px 0 20px; text-align: center; }
    .success-mark { display: grid; width: 52px; height: 52px; margin-bottom: 8px; place-items: center; border: 2px solid var(--success); border-radius: 50%; background: var(--surface); color: var(--success); }
    .success-mark svg { width: 32px; height: 32px; }
    .state-title { margin: 0; font-size: 24px; line-height: 1.35; }
    .state-copy { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .card { margin-bottom: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
    .card-kicker { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .venue { margin: 0; font-size: 16px; line-height: 1.45; }
    .pitch { margin: 4px 0 12px; color: var(--muted); font-size: 13px; }
    .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; line-height: 1.5; }
    .muted { color: var(--muted); }
    .amount { font-size: 20px; font-weight: 800; }
    .paid { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font-size: 13px; font-weight: 700; }
    .detail-line { margin: 8px 0 0; font-size: 13px; line-height: 1.55; }
    .rules { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .footer { position: absolute; right: 0; bottom: 0; left: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); background: var(--surface); }
    .cta { width: 100%; min-height: 44px; padding: 12px; border: 0; border-radius: 13px; background: var(--action-blue); color: var(--surface); font: 800 14px/1.4 inherit; }
  </style>
</head>
<body>
  <main class="artifact" data-state="booking-confirmed">
    <div class="status">9:41</div>
    <h1 class="nav">订单详情</h1>
    <section class="screen" aria-labelledby="state-title">
      <header class="hero">
        <span class="success-mark">
          <svg viewBox="0 0 32 32" role="img" aria-label="支付成功">
            <path d="M8 16.5l5 5L24.5 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </span>
        <h2 id="state-title" class="state-title">预订成功</h2>
        <p class="state-copy">订单已确认，场地已为你预订</p>
      </header>
      <article class="card">
        <p class="card-kicker">订单号 PB202607270001</p>
        <h3 class="venue">浦东星跃足球公园</h3>
        <p class="pitch">五人制 A 场</p>
        <div class="row"><span class="muted">7月28日 周二</span><b>19:00–21:00</b></div>
        <div class="row"><span class="muted">2 小时</span><span class="amount">¥320</span></div>
        <div class="paid"><span>已支付</span><span>¥320</span></div>
      </article>
      <article class="card">
        <p class="card-kicker">联系人</p>
        <p class="detail-line">张三 · 138****5678</p>
        <p class="detail-line">导航 · 上海市浦东新区锦绣东路 2777 弄 18 号</p>
        <p class="detail-line">客服电话 · 021-5899-2608</p>
      </article>
      <article class="card">
        <p class="card-kicker">取消规则</p>
        <p class="rules">开场前 24 小时可免费取消；不足 24 小时取消将收取订单金额的 50%。</p>
      </article>
    </section>
    <footer class="footer">
      <button type="button" class="cta">查看预订详情</button>
    </footer>
  </main>
</body>
</html>
