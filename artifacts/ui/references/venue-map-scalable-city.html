<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>可扩展地图目录 · 全城</title>
  <style>
    :root{--brand:#0369a1;--brand-soft:#e0f2fe;--ink:#10243e;--muted:#526479;--line:#d8e2ea;--surface:#fff;--map:#dce9e3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--map)}button{font:inherit;color:inherit;touch-action:manipulation}.artifact{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--map)}
    .map{position:absolute;inset:0;background:linear-gradient(112deg,transparent 0 55%,#badce3 55.5% 64%,transparent 64.5%),linear-gradient(18deg,transparent 0 42%,#f8fafc 42.5% 45%,transparent 45.5%),var(--map)}.road{position:absolute;height:7px;border:1px solid #cbd8d2;border-radius:9px;background:#fff}.road-a{top:190px;left:-28px;width:430px;transform:rotate(-9deg)}.road-b{top:300px;left:60px;width:380px;transform:rotate(31deg)}.district{position:absolute;font-size:12px;font-weight:650;color:#71877f}.hebei{top:150px;left:42px}.heping{top:270px;right:52px}
    .map-tools{position:absolute;z-index:4;top:20px;left:12px;right:12px;display:flex;gap:8px}.search,.locate{height:48px;border:1px solid rgba(16,36,62,.09);background:#fff;box-shadow:0 6px 20px rgba(16,36,62,.13)}.search{min-width:0;flex:1;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:16px;text-align:left;color:var(--muted)}.search svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}.locate{flex:0 0 48px;width:48px;min-width:48px;padding:0;border-radius:16px;display:grid;place-items:center}.locate svg{width:24px;height:24px;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round}.center-note{position:absolute;z-index:3;top:80px;left:12px;max-width:calc(100% - 24px);min-height:32px;display:flex;align-items:center;padding:0 12px;border:1px solid rgba(16,36,62,.08);border-radius:12px;background:rgba(255,255,255,.95);box-shadow:0 3px 12px rgba(16,36,62,.08);font-size:12px;font-weight:650;color:#3c5269}
    .marker{position:absolute;z-index:2;width:44px;height:44px;min-width:44px;min-height:44px;padding:5px;border:0;background:transparent}.marker svg{width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(16,36,62,.22))}.marker.online svg{fill:var(--brand);stroke:#fff;stroke-width:1.8}.marker.directory svg{fill:#fff;stroke:#526479;stroke-width:2}.m1{top:140px;left:18%}.m2{top:212px;left:48%}.m3{top:300px;left:70%}
    .sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;height:410px;padding:0 12px 16px;border-radius:24px 24px 0 0;background:var(--surface);box-shadow:0 -8px 28px rgba(16,36,62,.15)}.drag-handle{width:100%;height:44px;min-height:44px;border:0;background:transparent;display:grid;place-items:center}.drag-handle span{width:40px;height:4px;border-radius:4px;background:#b9c7d3}.sheet-head{height:44px;display:flex;align-items:center;justify-content:space-between}.sheet-head h1{margin:0;font-size:20px;line-height:1.2}.count{font-size:12px;color:var(--muted)}.filters{height:52px;display:flex;gap:8px;align-items:flex-start;overflow:hidden}.filter{height:44px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:13px;font-weight:650;white-space:nowrap}.filter.active{border-color:#8ed0ef;background:#f0f9ff;color:#075985}.venue-list{height:248px;display:flex;flex-direction:column;gap:8px;overflow:hidden}.venue-row{position:relative;flex:0 0 116px;height:116px;display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:8px;padding:12px 12px 12px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.venue-row.selected{border-color:transparent;background:#f0f9ff;box-shadow:inset 0 0 0 2px var(--brand)}.venue-copy{min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}.venue-name,.venue-address,.venue-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.venue-name{margin:0 0 5px;font-size:16px;line-height:22px}.venue-address{margin:0 0 7px;font-size:13px;line-height:18px;color:var(--muted)}.venue-meta{display:flex;align-items:center;gap:7px;font-size:12px;line-height:18px;color:#526479}.status{font-weight:750}.status.online{color:#0369a1}.status.directory{color:#475569}.dot{width:3px;height:3px;border-radius:50%;background:#94a3b8}.row-action{width:44px;height:44px;min-width:44px;min-height:44px;padding:0;border:1px solid var(--line);border-radius:14px;background:#f8fafc;display:grid;place-items:center}.row-action svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</head>
<body>
<main class="artifact" data-state="scalable-city" data-search-center="CITY">
  <div class="map" aria-label="天津全城平台球场示意地图，不是第三方地图瓦片"><i class="road road-a"></i><i class="road road-b"></i><span class="district hebei">河北区</span><span class="district heping">和平区</span></div>
  <header class="map-tools"><button class="search" type="button" aria-label="搜索球场或地图地点"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg><span>搜索球场或地图地点</span></button><button class="locate" type="button" aria-label="使用我的位置查看附近球场"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button></header>
  <div class="center-note">全城范围 · 未使用你的位置</div>
  <button class="marker online m1" type="button" aria-label="渤海元丰足球场，可在线预订"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 33s11-9.2 11-19A11 11 0 1 0 7 14c0 9.8 11 19 11 19Z"></path><circle cx="18" cy="14" r="4" fill="none"></circle></svg></button>
  <button class="marker directory m2" type="button" aria-label="天津奥林匹克中心五人制足球场，仅提供场馆信息"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 33s11-9.2 11-19A11 11 0 1 0 7 14c0 9.8 11 19 11 19Z"></path><rect x="15" y="11" width="6" height="6" rx="1" fill="none"></rect></svg></button>
  <button class="marker directory m3" type="button" aria-label="天津火车头体育场，仅提供场馆信息"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 33s11-9.2 11-19A11 11 0 1 0 7 14c0 9.8 11 19 11 19Z"></path><rect x="15" y="11" width="6" height="6" rx="1" fill="none"></rect></svg></button>
  <section class="sheet" data-snap="half" aria-label="全部球场纵向目录"><button class="drag-handle" type="button" aria-label="展开球场列表"><span></span></button><div class="sheet-head"><h1>全部球场</h1><span class="count">58 个已收录球场</span></div><div class="filters"><button class="filter active" type="button">综合排序</button><button class="filter" type="button">可在线预订</button><button class="filter" type="button">行政区</button></div><div class="venue-list">
    <article class="venue-row selected" data-booking-mode="ONLINE"><div class="venue-copy"><h2 class="venue-name">渤海元丰足球场</h2><p class="venue-address">天津市西青区利达路</p><div class="venue-meta"><span>五人制</span><i class="dot"></i><span class="status online">可在线预订</span></div></div><button class="row-action" type="button" aria-label="查看渤海元丰足球场可订时段"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></button></article>
    <article class="venue-row" data-booking-mode="DIRECTORY_ONLY"><div class="venue-copy"><h2 class="venue-name">天津奥林匹克中心五人制足球场</h2><p class="venue-address">天津市南开区宾水西道1号</p><div class="venue-meta"><span>五人制</span><i class="dot"></i><span class="status directory">仅提供场馆信息</span></div></div><button class="row-action" type="button" aria-label="查看天津奥林匹克中心五人制足球场详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></button></article>
    <article class="venue-row" data-booking-mode="DIRECTORY_ONLY"><div class="venue-copy"><h2 class="venue-name">天津火车头体育场</h2><p class="venue-address">天津市河北区中山北路增1号</p><div class="venue-meta"><span>十一人制</span><i class="dot"></i><span class="status directory">仅提供场馆信息</span></div></div><button class="row-action" type="button" aria-label="查看天津火车头体育场详情"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></button></article>
  </div></section>
</main>
</body>
</html>
