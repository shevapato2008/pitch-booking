<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>天津 · 目的入口</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #10243E; background: #F8FAFC; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #F8FAFC; }
      .artifact { width: 375px; height: 812px; overflow: hidden; background: #F8FAFC; }
      .system-row { height: 44px; position: relative; }
      .capsule-safe { position: absolute; top: 0; right: 0; width: 100px; height: 44px; }
      .custom-header { height: 44px; display: flex; align-items: center; padding: 0 100px 0 20px; background: #FFFFFF; border-bottom: 1px solid #DBE5EC; }
      .city-button { min-width: 72px; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; margin: 0; padding: 0; border: 0; background: #FFFFFF; color: #10243E; font: inherit; font-size: 16px; line-height: 24px; font-weight: 700; touch-action: manipulation; }
      .city-button:focus-visible { outline: 3px solid #0284C7; outline-offset: 2px; }
      .content { padding: 28px 20px 0; }
      .intro { margin: 0 0 24px; }
      .intro h1 { margin: 0 0 8px; font-size: 26px; line-height: 36px; letter-spacing: -0.5px; }
      .intro p { margin: 0; color: #64748B; font-size: 14px; line-height: 20px; }
      .intent-list { display: grid; gap: 12px; }
      .intent-card { width: 100%; min-height: 44px; height: 120px; display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: center; padding: 16px; border: 1px solid #DBE5EC; border-radius: 16px; background: #FFFFFF; color: #10243E; text-align: left; font: inherit; touch-action: manipulation; }
      .intent-card:focus-visible { outline: 3px solid #0284C7; outline-offset: 2px; }
      .intent-card svg { width: 28px; height: 28px; stroke: #0284C7; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .intent-card strong { display: block; margin-bottom: 4px; font-size: 17px; line-height: 24px; }
      .intent-card span { display: block; color: #64748B; font-size: 13px; line-height: 20px; }
      .footnote { margin: 20px 4px 0; color: #64748B; font-size: 12px; line-height: 18px; }
    </style>
  </head>
  <body>
    <main class="artifact" data-state="first-entry">
      <div class="system-row" aria-hidden="true"><div class="capsule-safe"></div></div>
      <header class="custom-header"><button class="city-button" type="button" aria-label="选择城市，当前天津">天津⌄</button></header>
      <section class="content" aria-labelledby="page-title">
        <div class="intro">
          <h1 id="page-title">你今天想做什么？</h1>
          <p>选择一个目的开始，之后可以随时切换。</p>
        </div>
        <div class="intent-list" aria-label="选择当下目的">
          <button class="intent-card" type="button" aria-label="我要出租场地，申请合作，或进入已授权的场馆工作台">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5h16v14M8 5v14M16 5v14M4 10h16M4 15h16" /><path d="M11 19v-3h2v3" /></svg>
            <span><strong>我要出租场地</strong>申请合作，或进入已授权的场馆工作台</span>
          </button>
          <button class="intent-card" type="button" aria-label="我要租赁场地，为球队查找时间、价格和可订整场">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.4 6.4l2.1 2.1M15.5 15.5l2.1 2.1M17.6 6.4l-2.1 2.1M8.5 15.5l-2.1 2.1" /></svg>
            <span><strong>我要租赁场地</strong>为球队查找时间、价格和可订整场</span>
          </button>
          <button class="intent-card" type="button" aria-label="我要找球踢，没有球队，也能加入已锁定场地的开放球局">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" /><circle cx="17" cy="10" r="2" /><path d="M4 20c0-4 2-6 5-6s5 2 5 6M14 19c.4-2.6 1.5-4 3-4 1.8 0 3 1.5 3 4" /></svg>
            <span><strong>我要找球踢</strong>没有球队，也能加入已锁定场地的开放球局</span>
          </button>
        </div>
        <p class="footnote">这里选择的是当下目的，不是永久身份。</p>
      </section>
    </main>
  </body>
</html>
